                            const entries = [];
                            while (remaining.length > 0) {
                                remaining = remaining.replace(/^\s+/, '');
                                if (remaining === '') break;
                                const tm = remaining.match(/^-\s*time\s*\[\s*"(\d+)"\s*\]\s*"([^"]*)"\s*=\s*"([^"]*)"\s*/i);
                                if (!tm) {
                                    return err('input-choose[long-press]: expected -time["N"]"key"="value", got "' +
                                        remaining.substring(0, 20) + '"');
                                }
                                const timeSec = parseInt(tm[1], 10);
                                const key = tm[2];
                                const value = tm[3];
                                if (key.length !== 1) {
                                    return err('input-choose[long-press]: key must be a single character, got "' + key + '"');
                                }
                                if (!Number.isInteger(timeSec) || timeSec <= 0) {
                                    return err('input-choose[long-press]: time must be a positive integer, got "' + tm[1] + '"');
                                }
                                entries.push({ key, time: timeSec, value });
                                remaining = remaining.substring(tm[0].length);
                            }

                            if (entries.length === 0) {
                                return err('input-choose[long-press]: no time entries specified');
                            }
                            if (type === 'number') {
                                for (const e of entries) {
                                    if (!isValidNumber(e.value)) {
                                        return err('input-choose[long-press]: value "' + e.value +
                                            '" for key "' + e.key + '" is not a valid number');
                                    }
                                }
                            }

                            const keyMap = {};
                            for (const e of entries) {
                                if (!Object.prototype.hasOwnProperty.call(keyMap, e.key)) keyMap[e.key] = [];
                                keyMap[e.key].push({ time: e.time, value: e.value });
                            }
                            for (const k in keyMap) keyMap[k].sort((a, b) => a.time - b.time);

                            pendingInput = {
                                kind: 'long-press',
                                varName: varName,
                                type: type,
                                color: varColor,
                                keyMap: keyMap,
                                pressedKey: null,
                                timers: [],
                                triggered: false
                            };

                            if (promptSegments.length > 0) outputLines.push(renderSegments(promptSegments));
                            render();
                            return '';
                        }

                        // New exec mode: "prompt"-time["N"]"key"=(cmd)
                        const r = parseLongPressExecFormat(remaining);
                        if (!r.ok) return err('input-choose[long-press]: ' + r.error);
                        const promptSegments = promptTokensToSegments(r.value.promptTokens);
                        const entries = r.value.entries;

                        const keyMap = {};
                        for (const e of entries) {
                            if (!Object.prototype.hasOwnProperty.call(keyMap, e.key)) keyMap[e.key] = [];
                            keyMap[e.key].push({ time: e.time, cmd: e.cmd });
                        }
                        for (const k in keyMap) keyMap[k].sort((a, b) => a.time - b.time);

                        pendingInput = {
                            kind: 'long-press-exec',
                            keyMap: keyMap,
                            pressedKey: null,
                            timers: [],
                            triggered: false
                        };

                        if (promptSegments.length > 0) outputLines.push(renderSegments(promptSegments));
                        render();
                        return '';
                    }

                    // ----- REGULAR -----
                    // New exec mode: input-choose"prompt"-"opt"=(cmd)
                    if (!rest.startsWith('[')) {
                        const r = parseChooseExecFormat(rest);
                        if (!r.ok) return err('input-choose: ' + r.error);
                        const promptSegments = promptTokensToSegments(r.value.promptTokens);
                        const options = r.value.options;

                        pendingInput = {
                            kind: 'choose-exec',
                            options: options
                        };

                        if (promptSegments.length > 0) outputLines.push(renderSegments(promptSegments));
                        render();
                        return '';
                    }

                    // Old storage mode: input-choose["var"]-type"prompt"-"opt"="value"
                    const headerMatch = rest.match(/^\[\s*"([^"]+)"\s*\]([\s\S]*)$/);
                    if (!headerMatch) return err('input-choose: Usage: input-choose["var"]-type"prompt"-"opt"="val"...');
                    const varName = headerMatch[1];
                    let remaining = headerMatch[2].trim();

                    const nameErr = varNameError(varName);
                    if (nameErr) return err('input-choose: ' + nameErr);
                    if (variables[varName]) return err('input-choose: variable "' + varName + '" already exists');

                    let varColor = null;
                    const colorFirstMatch = remaining.match(/^-color\s*\[\s*"([^"]+)"\s*\]\s*/i);
                    if (colorFirstMatch) {
                        varColor = colorFirstMatch[1];
                        const ce = colorError(varColor);
                        if (ce) return err('input-choose: ' + ce);
                        remaining = remaining.substring(colorFirstMatch[0].length).trim();
                    }

                    const typeMatch = remaining.match(/^-?\s*(text|number)\s*/i);
                    if (!typeMatch) return err('input-choose: missing type (text or number)');
                    const type = typeMatch[1].toLowerCase();
                    remaining = remaining.substring(typeMatch[0].length);

                    const optStart = remaining.search(/-"[^"]+"\s*=\s*"/);
                    let promptExpr = '', optionsExpr = '';
                    if (optStart >= 0) {
                        promptExpr = remaining.slice(0, optStart).trim();
                        optionsExpr = remaining.slice(optStart);
                    } else promptExpr = remaining.trim();

                    let promptSegments = [];
                    if (promptExpr !== '') {
                        const pr = parseMultiColorValue(promptExpr, varColor, true);
                        if (!pr.ok) return err('input-choose: ' + pr.error);
                        promptSegments = pr.value;
                    }

                    const options = {};
                    let oi = 0;
                    while (oi < optionsExpr.length) {
                        while (oi < optionsExpr.length && /\s/.test(optionsExpr[oi])) oi++;
                        if (oi >= optionsExpr.length) break;
                        if (optionsExpr[oi] !== '-') return err('input-choose: expected "-" before option');
                        oi++;
                        while (oi < optionsExpr.length && /\s/.test(optionsExpr[oi])) oi++;
                        if (oi >= optionsExpr.length || optionsExpr[oi] !== '"') return err('input-choose: expected option name in quotes');
                        let j = oi + 1;
                        while (j < optionsExpr.length && optionsExpr[j] !== '"') j++;
                        if (j >= optionsExpr.length) return err('input-choose: unterminated option name');
                        const optName = optionsExpr.slice(oi + 1, j);
                        oi = j + 1;
                        while (oi < optionsExpr.length && /\s/.test(optionsExpr[oi])) oi++;
                        if (oi >= optionsExpr.length || optionsExpr[oi] !== '=') return err('input-choose: expected "=" after option "' + optName + '"');
                        oi++;
                        while (oi < optionsExpr.length && /\s/.test(optionsExpr[oi])) oi++;
                        if (oi >= optionsExpr.length || optionsExpr[oi] !== '"') return err('input-choose: expected value in quotes');
                        j = oi + 1;
                        while (j < optionsExpr.length && optionsExpr[j] !== '"') j++;
                        if (j >= optionsExpr.length) return err('input-choose: unterminated option value');
                        const optValue = optionsExpr.slice(oi + 1, j);
                        oi = j + 1;
                        if (options.hasOwnProperty(optName)) return err('input-choose: duplicate option "' + optName + '"');
                        options[optName] = optValue;
                    }
                    if (Object.keys(options).length === 0) return err('input-choose: no options specified');
                    if (type === 'number') {
                        for (const optName in options) {
                            if (!isValidNumber(options[optName])) {
                                return err('input-choose: option "' + optName + '" value "' + options[optName] + '" is not a valid number');
                            }
                        }
                    }

                    pendingInput = {
                        kind: 'choose',
                        varName: varName,
                        type: type,
                        color: varColor,
                        options: options
                    };

                    if (promptSegments.length > 0) outputLines.push(renderSegments(promptSegments));
                    render();
                    return '';
                }

                /* --------- input --------- */
                if (command === 'input') {
                    const varMatch = rest.match(/^\[\s*"([^"]+)"\s*\]([\s\S]*)$/);
                    if (!varMatch) return err('input: Usage: input["var"]-text"prompt"');
                    const varName = varMatch[1];
                    let remaining = varMatch[2].trim();

                    const nameErr = varNameError(varName);
                    if (nameErr) return err('input: ' + nameErr);
                    if (variables[varName]) return err('input: variable "' + varName + '" already exists');

                    let varColor = null;
                    const colorFirstMatch = remaining.match(/^-color\s*\[\s*"([^"]+)"\s*\]\s*/i);
                    if (colorFirstMatch) {
                        varColor = colorFirstMatch[1];
                        const ce = colorError(varColor);
                        if (ce) return err('input: ' + ce);
                        remaining = remaining.substring(colorFirstMatch[0].length).trim();
                    }

                    const typeMatch = remaining.match(/^-?\s*(text|number)\s*/i);
                    if (!typeMatch) {
                        if (remaining === '') return err('input: missing type (text or number)');
                        return err('input: expected "-text" or "-number"');
                    }
                    const type = typeMatch[1].toLowerCase();
                    remaining = remaining.substring(typeMatch[0].length);

                    let promptSegments = [];
                    if (remaining.trim() !== '') {
                        const pr = parseMultiColorValue(remaining, varColor, true);
                        if (!pr.ok) return err('input: ' + pr.error);
                        promptSegments = pr.value;
                    }

                    pendingInput = {
                        kind: 'input',
                        varName: varName,
                        type: type,
                        color: varColor
                    };

                    if (promptSegments.length > 0) outputLines.push(renderSegments(promptSegments));
                    render();
                    return '';
                }

                /* --------- save --------- */
                if (command === 'save') {
                    const match = rest.match(/^"([^"]+)"(?:\s*-\s*(xor))?\s*$/i);
                    if (!match) return err('save: Usage: save"name" or save"name"-xor');
                    const name = match[1];
                    if (!name) return err('save: name cannot be empty');
                    const encrypted = !!match[2];
                    return saveToFile(name, encrypted);
                }

                /* --------- load --------- */
                if (command === 'load') {
                    if (rest !== '') return err('load: takes no arguments. Usage: load');
                    setTimeout(() => openLoadDialog(), 10);
                    return '';
                }

                /* --------- list family --------- */
                if (command === 'list') {
                    if (rest === '') {
                        if (Object.keys(lists).length === 0) return hint('(no lists defined)');
                        let result = '';
                        for (const name in lists) {
                            result += 'list: ' + name + '\n';
                            for (const itemName in lists[name]) result += '  ' + itemName + ' = ' + lists[name][itemName] + '\n';
                        }
                        return result.replace(/\n$/, '');
                    }
                    const accessMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*"([^"]*)"\s*$/);
                    if (accessMatch) {
                        const listName = accessMatch[1], itemName = accessMatch[2];
                        if (!lists[listName]) return err('list: list "' + listName + '" not found');
                        if (!lists[listName].hasOwnProperty(itemName)) return err('list: item "' + itemName + '" not found');
                        return processCommand(lists[listName][itemName], true);
                    }
                    const createMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*(.*)$/i);
                    if (!createMatch) return err('list: bad syntax');
                    const listName = createMatch[1];
                    let itemsPart = createMatch[2].trim();
                    const nameErr = varNameError(listName);
                    if (nameErr) return err('list: ' + nameErr);
                    if (lists[listName]) return err('list: list already exists');
                    if (itemsPart === '') { lists[listName] = {}; return ''; }
                    const items = {};
                    while (itemsPart.length > 0) {
                        itemsPart = itemsPart.trim();
                        if (!itemsPart.startsWith('-')) return err('list: expected "-"');
                        itemsPart = itemsPart.substring(1).trim();
                        const parenIndex = itemsPart.indexOf('(');
                        if (parenIndex === -1) return err('list: bad item definition');
                        const itemName = itemsPart.substring(0, parenIndex).trim();
                        if (itemName === '') return err('list: item name empty');
                        if (items.hasOwnProperty(itemName)) return err('list: duplicate item "' + itemName + '"');
                        const pr = extractParenthesized(itemsPart, parenIndex);
                        if (!pr) return err('list: missing ")"');
                        items[itemName] = pr.content;
                        itemsPart = itemsPart.substring(pr.endPos).trim();
                    }
                    lists[listName] = items; return '';
                }
                if (command === 'list-add') {
                    const lMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*(.*)$/i);
                    if (!lMatch) return err('list-add: bad syntax');
                    const listName = lMatch[1];
                    let remaining = lMatch[2].trim();
                    if (!lists[listName]) return err('list-add: list not found');
                    if (!remaining.startsWith('-')) return err('list-add: expected "-"');
                    remaining = remaining.substring(1).trim();
                    const parenIndex = remaining.indexOf('(');
                    if (parenIndex === -1) return err('list-add: bad item');
                    const itemName = remaining.substring(0, parenIndex).trim();
                    if (itemName === '') return err('list-add: item name empty');
                    if (lists[listName].hasOwnProperty(itemName)) return err('list-add: item exists');
                    const pr = extractParenthesized(remaining, parenIndex);
                    if (!pr) return err('list-add: missing ")"');
                    const after = remaining.substring(pr.endPos).trim();
                    if (after !== '') return err('list-add: trailing text');
                    lists[listName][itemName] = pr.content; return '';
                }
                if (command === 'list-delete') {
                    let param = rest.trim();
                    if (param === '') return err('list-delete: missing arg');
                    if (param.toLowerCase() === '=all') { lists = {}; return ''; }
                    const allMatch = param.match(/^\[\s*"([^"]+)"\s*\]\s*=\s*all\s*$/i);
                    if (allMatch) {
                        if (!lists[allMatch[1]]) return err('list-delete: list not found');
                        lists[allMatch[1]] = {}; return '';
                    }
                    const match = param.match(/^\[\s*"([^"]+)"\s*\]\s*"([^"]*)"\s*$/);
                    if (!match) return err('list-delete: bad syntax');
                    if (!lists[match[1]]) return err('list-delete: list not found');
                    if (!lists[match[1]].hasOwnProperty(match[2])) return err('list-delete: item not found');
                    delete lists[match[1]][match[2]]; return '';
                }
                if (command === 'list-rename') {
                    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*"([^"]*)"\s*$/);
                    if (!match) return err('list-rename: bad syntax');
                    const nameErr1 = varNameError(match[1]);
                    if (nameErr1) return err('list-rename: ' + nameErr1);
                    const nameErr2 = varNameError(match[2]);
                    if (nameErr2) return err('list-rename: ' + nameErr2);
                    if (!lists[match[1]]) return err('list-rename: list not found');
                    if (lists[match[2]]) return err('list-rename: target exists');
                    lists[match[2]] = lists[match[1]];
                    delete lists[match[1]]; return '';
                }
                if (command === 'list-replace') {
                    const lMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*(.*)$/i);
                    if (!lMatch) {
                        return err('list-replace: bad syntax. Usage: list-replace["list"]-oldItem-newItem(newCmd)');
                    }
                    const listName = lMatch[1];
                    let remaining = lMatch[2].trim();
                    if (!lists[listName]) return err('list-replace: list "' + listName + '" not found');
                    if (!remaining.startsWith('-')) {
                        return err('list-replace: expected "-" before old item name. Usage: list-replace["list"]-oldItem-newItem(newCmd)');
                    }
                    remaining = remaining.substring(1).trim();

                    const dashIdx = remaining.indexOf('-');
                    if (dashIdx === -1) {
                        return err('list-replace: expected "-" between old item and new item');
                    }
                    const oldName = remaining.substring(0, dashIdx).trim();
                    if (oldName === '') {
                        return err('list-replace: old item name cannot be empty');
                    }
                    remaining = remaining.substring(dashIdx + 1).trim();

                    const parenIndex = remaining.indexOf('(');
                    if (parenIndex === -1) {
                        return err('list-replace: new item must look like newItemName(newCmd), e.g. -2(text"dsds")');
                    }
                    const newName = remaining.substring(0, parenIndex).trim();
                    if (newName === '') {
                        return err('list-replace: new item name cannot be empty');
                    }
                    const newP = extractParenthesized(remaining, parenIndex);
                    if (!newP) {
                        return err('list-replace: missing closing ")" for new item');
                    }
                    const newCmd = newP.content;
                    const after = remaining.substring(newP.endPos).trim();
                    if (after !== '') {
                        return err('list-replace: unexpected trailing text "' + after + '"');
                    }

                    if (!lists[listName].hasOwnProperty(oldName)) {
                        return err('list-replace: item "' + oldName + '" not found in list "' + listName + '"');
                    }
                    if (newName !== oldName && lists[listName].hasOwnProperty(newName)) {
                        return err('list-replace: item "' + newName + '" already exists in list "' + listName + '"');
                    }
                    delete lists[listName][oldName];
                    lists[listName][newName] = newCmd;
                    return '';
                }

                /* --------- text --------- */
                if (command === 'text') {
                    const concatMatch = rest.match(/^\[\s*concatenation\s*\]\s*-?\s*"([\s\S]*)"\s*$/i);
                    if (concatMatch) {
                        const result = evaluateComputation(concatMatch[1]);
                        if (!result.ok) return err('text[concatenation]: ' + result.error);
                        return escapeHtml(result.value);
                    }

                    const varMatch = rest.match(/^\[\s*"([^"]+)"\s*\]([\s\S]*)$/);
                    if (varMatch) {
                        const varName = varMatch[1];
                        const afterName = varMatch[2].trim();
                        const nameErr = varNameError(varName);
                        if (nameErr) return err('text: ' + nameErr);

                        if (afterName === '') {
                            if (!variables[varName]) return err('text: variable "' + varName + '" not found');
                            if (variables[varName].type !== 'text') return err('text: variable is not text type');
                            return renderVariable(variables[varName]);
                        }

                        if (variables[varName]) return err('text: variable "' + varName + '" already exists. Use variable-replace to change.');
                        const pr = parseMultiColorValue(afterName, null, true);
                        if (!pr.ok) return err('text: ' + pr.error);
                        const bv = buildVariable('text', pr.value, true);
                        if (!bv.ok) return err('text: ' + bv.error);
                        variables[varName] = bv.value;
                        return '';
                    }

                    if (rest.startsWith('"')) {
                        const pr = parseMultiColorValue(rest, null, true);
                        if (!pr.ok) return err('text: ' + pr.error);
                        return renderSegments(pr.value);
                    }
                    return err('text: bad syntax');
                }

                /* --------- number --------- */
                if (command === 'number') {
                    const concatMatch = rest.match(/^\[\s*concatenation\s*\]\s*-?\s*"([\s\S]*)"\s*$/i);
                    if (concatMatch) {
                        const result = evaluatePureConcatenation(concatMatch[1]);
                        if (!result.ok) return err('number[concatenation]: ' + result.error);
                        if (!isValidNumber(result.value)) return err('number[concatenation]: not a valid number');
                        return escapeHtml(formatNumber(parseFloat(result.value)));
                    }

                    const varMatch = rest.match(/^\[\s*"([^"]+)"\s*\]([\s\S]*)$/);
                    if (varMatch) {
                        const varName = varMatch[1];
                        const afterName = varMatch[2].trim();
                        const nameErr = varNameError(varName);
                        if (nameErr) return err('number: ' + nameErr);

                        if (afterName === '') {
                            if (!variables[varName]) return err('number: variable "' + varName + '" not found');
                            if (variables[varName].type !== 'number') return err('number: variable is not number type');
                            return renderVariable(variables[varName]);
                        }

                        if (variables[varName]) return err('number: variable "' + varName + '" already exists. Use variable-replace to change.');
                        const pr = parseMultiColorValue(afterName, null, false);
                        if (!pr.ok) return err('number: ' + pr.error);
                        const bv = buildVariable('number', pr.value, false);
                        if (!bv.ok) return err('number: ' + bv.error);
                        variables[varName] = bv.value;
                        return '';
                    }

                    if (rest.startsWith('"')) {
                        const pr = parseMultiColorValue(rest, null, false);
                        if (!pr.ok) return err('number: ' + pr.error);
                        const fullText = pr.value.map(s => s.text).join('');
                        if (!isValidNumber(fullText)) return err('number: "' + fullText + '" is not a valid number');
                        return renderSegments(pr.value);
                    }
                    return err('number: bad syntax');
                }

                /* --------- text-color --------- */
                if (command === 'text-color') {
                    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*([\s\S]*)$/);
                    if (!match) return err('text-color: Usage: text-color["color"]"text"');
                    const ce = colorError(match[1]);
                    if (ce) return err('text-color: ' + ce);
                    const pr = parseMultiColorValue(match[2], match[1], true);
                    if (!pr.ok) return err('text-color: ' + pr.error);
                    return renderSegments(pr.value);
                }

                /* --------- number-color --------- */
                if (command === 'number-color') {
                    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*([\s\S]*)$/);
                    if (!match) return err('number-color: Usage: number-color["color"]"123"');
                    const ce = colorError(match[1]);
                    if (ce) return err('number-color: ' + ce);
                    const pr = parseMultiColorValue(match[2], match[1], false);
                    if (!pr.ok) return err('number-color: ' + pr.error);
                    return renderSegments(pr.value);
                }

                /* --------- computation --------- */
                if (command === 'computation') {
                    let mainRest = rest;
                    let colorName = null;
                    const cs = rest.match(/^(.*?)\s*-\s*color\s*\[\s*"([^"]+)"\s*\]\s*$/i);
                    if (cs) {
                        mainRest = cs[1].trim();
                        colorName = cs[2];
                        const ce = colorError(colorName);
                        if (ce) return err('computation: ' + ce);
                    }
                    const KNOWN_MODES = ['modulo', 'round', 'variable', 'variable-modulo', 'variable-round'];
                    const modeMatch = mainRest.match(/^\[\s*([^\]]+)\s*\]\s*"([^"]*)"(?:\s*-\s*\[\s*"([^"]+)"\s*\])?\s*$/i);
                    if (modeMatch) {
                        const mode = modeMatch[1].trim().toLowerCase();
                        const expr = modeMatch[2];
                        const varName = modeMatch[3] || null;
                        if (KNOWN_MODES.indexOf(mode) === -1) return err('computation: unknown mode');
                        if (mode === 'modulo') {
                            const r = evaluateModulo(expr);
                            if (!r.ok) return err('computation: ' + r.error);
                            return colorName ? '<span style="color: ' + COLOR_MAP[colorName] + '">' + escapeHtml(r.value) + '</span>' : r.value;
                        }
                        if (mode === 'round') {
                            const r = evaluateRound(expr);
                            if (!r.ok) return err('computation: ' + r.error);
                            return colorName ? '<span style="color: ' + COLOR_MAP[colorName] + '">' + escapeHtml(r.value) + '</span>' : r.value;
                        }
                        if (mode === 'variable' || mode === 'variable-modulo' || mode === 'variable-round') {
                            if (!varName) return err('computation: missing target variable');
                            const ne = varNameError(varName);
                            if (ne) return err('computation: ' + ne);
                            let result;
                            if (mode === 'variable') result = evaluateComputation(expr);
                            else if (mode === 'variable-modulo') result = evaluateModulo(expr);
                            else result = evaluateRound(expr);
                            if (!result.ok) return err('computation: ' + result.error);
                            if (mode === 'variable' && !isValidNumber(result.value)) {
                                variables[varName] = { type: 'text', value: result.value };
                            } else {
                                variables[varName] = { type: 'number', value: parseFloat(result.value) };
                            }
                            if (colorName) variables[varName].color = colorName;
                            return '';
                        }
                    }
                    if (!mainRest.startsWith('"')) return err('computation: expression must be in quotes');
                    const exprMatch = mainRest.match(/^"([^"]*)"\s*$/);
                    if (!exprMatch) return err('computation: bad syntax');
                    const result = evaluateComputation(exprMatch[1]);
                    if (!result.ok) return err('computation: ' + result.error);
                    return colorName ? '<span style="color: ' + COLOR_MAP[colorName] + '">' + escapeHtml(result.value) + '</span>' : escapeHtml(result.value);
                }

                /* --------- time --------- */
                if (command === 'time') {
                    let delay = null, innerCommand = null;
                    const vtm = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-\s*(.*)$/i);
                    if (vtm) {
                        const nameErr = varNameError(vtm[1]);
                        if (nameErr) return err('time: ' + nameErr);
                        if (!variables[vtm[1]]) return err('time: variable "' + vtm[1] + '" not found');
                        if (variables[vtm[1]].type !== 'number') return err('time: variable is not number');
                        delay = variables[vtm[1]].value;
                        innerCommand = vtm[2].trim();
                        if (!Number.isInteger(delay) || delay < 0) return err('time: delay must be non-negative integer');
                    } else {
                        const lm = rest.match(/^"(\d+)"\s*-\s*(.*)$/i);
                        if (lm) { delay = parseInt(lm[1], 10); innerCommand = lm[2].trim(); }
                    }
                    if (delay === null) return err('time: Usage: time"seconds"-command');
                    if (innerCommand === '') return err('time: missing command');
                    setTimeout(() => {
                        if (!skipDisplayCommand) outputLines.push(PROMPT + innerCommand);
                        const output = processCommand(innerCommand, true);
                        if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
                        render();
                    }, delay * 1000);
                    return 'Scheduled in ' + delay + 's: ' + innerCommand;
                }

                /* --------- run --------- */
                if (command === 'run') {
                    const subcommands = extractSubCommands(rest);
                    if (subcommands.length === 0) return err('run: bad syntax');
                    executeSequentialCommands(subcommands);
                    return '';
                }

                /* --------- while --------- */
                if (command === 'while') {
                    const wm = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-(eq|ne|gt|lt|ge|le)\s*-?\s*\[\s*"([^"]+)"\s*\]\s*-\s*do\s*(.*)$/i);
                    if (!wm) return err('while: bad syntax');
                    const v1Name = wm[1], op = wm[2].toLowerCase(), v2Name = wm[3], doPart = wm[4].trim();
                    let ne = varNameError(v1Name); if (ne) return err('while: ' + ne);
                    ne = varNameError(v2Name); if (ne) return err('while: ' + ne);
                    if (!variables[v1Name] || !variables[v2Name]) return err('while: variable not found');
                    const subs = extractSubCommands(doPart);
                    if (subs.length === 0) return err('while: -do(...) needs commands');
                    if (variables[v1Name].type !== variables[v2Name].type) return err('while: cannot compare different types');

                    function cond() {
                        const a = variables[v1Name], b = variables[v2Name];
                        if (a.type === 'number') {
                            switch (op) {
                                case 'eq': return a.value === b.value;
                                case 'ne': return a.value !== b.value;
                                case 'gt': return a.value > b.value;
                                case 'lt': return a.value < b.value;
                                case 'ge': return a.value >= b.value;
                                case 'le': return a.value <= b.value;
                            }
                        } else {
                            const l1 = String(a.value).length, l2 = String(b.value).length;
                            switch (op) {
                                case 'eq': return l1 === l2;
                                case 'ne': return l1 !== l2;
                                case 'gt': return l1 > l2;
                                case 'lt': return l1 < l2;
                                case 'ge': return l1 >= l2;
                                case 'le': return l1 <= l2;
                            }
                        }
                        return false;
                    }
                    function execBody(i) {
                        if (i >= subs.length) return true;
                        const output = processCommand(subs[i], true);
                        if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
                        return execBody(i + 1);
                    }
                    while (cond()) execBody(0);
                    render();
                    return '';
                }

                /* --------- random --------- */
                if (command === 'random') {
                    const trimmedRest = rest.trim();
                    const textRandomMatch = trimmedRest.match(/^"(\d+)"\s*-\s*text\s*([\s\S]*)$/);
                    if (textRandomMatch) {
                        const count = parseInt(textRandomMatch[1], 10);
                        const texts = [];
                        const ms = textRandomMatch[2].match(/"([^"]*)"/g);
                        if (ms) for (const m of ms) texts.push(m.slice(1, -1));
                        if (texts.length === 0) return err('random: no texts');
                        if (count <= 0) return err('random: count must be positive');
                        if (count > texts.length) return err('random: count > texts');
                        const idx = [...Array(texts.length).keys()];
                        for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
                        return idx.slice(0, count).map(i => texts[i]).join('\n');
                    }
                    const numRandomMatch = trimmedRest.match(/^"(\d+)"\s*-\s*number\s*"(-?\d+)"\s*-\s*"(-?\d+)"\s*$/);
                    if (numRandomMatch) {
                        const count = parseInt(numRandomMatch[1], 10);
                        const min = parseInt(numRandomMatch[2], 10), max = parseInt(numRandomMatch[3], 10);
                        if (min > max) return err('random: min > max');
                        const rangeSize = max - min + 1;
                        if (count <= 0) return err('random: count must be positive');
                        if (count > rangeSize) return err('random: count > range');
                        const pool = []; for (let i = min; i <= max; i++) pool.push(i);
                        for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
                        return pool.slice(0, count).join('\n');
                    }
                    const multiRM = trimmedRest.match(/^"(\d+)"\s*-\s*(\([\s\S]*)$/);
                    if (multiRM) {
                        const count = parseInt(multiRM[1], 10);
                        const subs = extractSubCommands(multiRM[2].trim());
                        if (subs.length === 0) return err('random: bad command list');
                        if (count <= 0) return err('random: count must be positive');
                        if (count > subs.length) return err('random: count > commands');
                        const idx = [...Array(subs.length).keys()];
                        for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
                        executeSequentialCommands(idx.slice(0, count).map(i => subs[i]));
                        return '';
                    }
                    if (trimmedRest.startsWith('(')) {
                        const subs = extractSubCommands(trimmedRest);
                        if (subs.length === 0) return err('random: bad command list');
                        return processCommand(subs[Math.floor(Math.random() * subs.length)], true);
                    }
                    if (rest.toLowerCase() === '-uuid') return generateUUID();
                    const params = [];
                    const ms = rest.match(/"([^"]*)"/g);
                    if (ms) for (const m of ms) params.push(m.slice(1, -1));
                    if (params.length < 2) return err('random: need at least 2 args');
                    const allInts = params.every(p => /^-?\d+$/.test(p));
                    if (params.length === 2 && allInts) {
                        const min = parseInt(params[0], 10), max = parseInt(params[1], 10);
                        if (min > max) return err('random: min > max');
                        return String(Math.floor(Math.random() * (max - min + 1)) + min);
                    }
                    return params[Math.floor(Math.random() * params.length)];
                }

                /* --------- repeat --------- */
                if (command === 'repeat') {
                    let count = null, innerCmd = null;
                    const litRepeat = rest.match(/^"(\d+)"\s*-\s*(.*)$/i);
                    const varRepeat = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-\s*(.*)$/i);
                    if (litRepeat) { count = parseInt(litRepeat[1], 10); innerCmd = litRepeat[2].trim(); }
                    else if (varRepeat) {
                        const nameErr = varNameError(varRepeat[1]);
                        if (nameErr) return err('repeat: ' + nameErr);
                        if (!variables[varRepeat[1]]) return err('repeat: variable not found');
                        if (variables[varRepeat[1]].type !== 'number') return err('repeat: variable not number');
                        count = variables[varRepeat[1]].value;
                        innerCmd = varRepeat[2].trim();
                    } else return err('repeat: bad syntax');
                    if (!Number.isInteger(count) || count <= 0) return err('repeat: count must be positive integer');
                    if (innerCmd === '') return err('repeat: missing command');
                    const timeM = innerCmd.match(/^time\s*(?:"(\d+)"|\[\s*"([^"]+)"\s*\])\s*-\s*(.*)$/i);
                    if (timeM) {
                        let delay;
                        if (timeM[1]) delay = parseInt(timeM[1], 10);
                        else {
                            if (!variables[timeM[2]]) return err('repeat: time var not found');
                            if (variables[timeM[2]].type !== 'number') return err('repeat: time var not number');
                            delay = variables[timeM[2]].value;
                        }
                        const actualCmd = timeM[3].trim();
                        if (actualCmd === '') return err('repeat: missing command');
                        let ex = 0;
                        function sched() {
                            if (ex >= count) return;
                            setTimeout(() => {
                                const output = processCommand(actualCmd, true);
                                if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
                                ex++; sched(); render();
                            }, delay * 1000);
                        }
                        sched();
                        return 'Scheduled ' + count + ' times every ' + delay + 's';
                    } else {
                        let combinedOutput = '';
                        for (let i = 0; i < count; i++) {
                            const output = processCommand(innerCmd, true);
                            if (output !== '') combinedOutput += output + '\n';
                        }
                        return combinedOutput.replace(/\n$/, '');
                    }
                }

                /* --------- if --------- */
                if (command === 'if') {
                    const trueIdx = rest.indexOf('-true=');
                    const falseIdx = rest.indexOf('-false=');
                    if (trueIdx === -1) return err('if: missing "-true="');
                    if (falseIdx === -1) return err('if: missing "-false="');
                    if (trueIdx > falseIdx) return err('if: -true must come before -false');
                    const condPart = rest.substring(0, trueIdx);
                    const trueRaw = rest.substring(trueIdx + 6, falseIdx);
                    const falseRaw = rest.substring(falseIdx + 7);
                    if (trueRaw.trim() === '') return err('if: -true= is empty');
                    if (falseRaw.trim() === '') return err('if: -false= is empty');
                    const tp = extractParenthesized(trueRaw, 0);
                    if (!tp) return err('if: -true= must have (command)');
                    const fp = extractParenthesized(falseRaw, 0);
                    if (!fp) return err('if: -false= must have (command)');
                    const condMatch = condPart.match(/^\[\s*"([^"]+)"\s*\]\s*-(eq|ne|gt|lt|ge|le)\s*-?\s*\[\s*"([^"]+)"\s*\]$/i);
                    if (!condMatch) return err('if: bad condition');
                    const v1Name = condMatch[1], op = condMatch[2].toLowerCase(), v2Name = condMatch[3];
                    let ne = varNameError(v1Name); if (ne) return err('if: ' + ne);
                    ne = varNameError(v2Name); if (ne) return err('if: ' + ne);
                    if (!variables[v1Name] || !variables[v2Name]) return err('if: variable not found');
                    const a = variables[v1Name], b = variables[v2Name];
                    if (a.type !== b.type) return err('if: cannot compare different types');
                    let condRes = false;
                    if (a.type === 'number') {
                        switch (op) {
                            case 'eq': condRes = a.value === b.value; break;
                            case 'ne': condRes = a.value !== b.value; break;
                            case 'gt': condRes = a.value > b.value; break;
                            case 'lt': condRes = a.value < b.value; break;
                            case 'ge': condRes = a.value >= b.value; break;
                            case 'le': condRes = a.value <= b.value; break;
                        }
                    } else {
                        const l1 = String(a.value).length, l2 = String(b.value).length;
                        switch (op) {
                            case 'eq': condRes = l1 === l2; break;
                            case 'ne': condRes = l1 !== l2; break;
                            case 'gt': condRes = l1 > l2; break;
                            case 'lt': condRes = l1 < l2; break;
                            case 'ge': condRes = l1 >= l2; break;
                            case 'le': condRes = l1 <= l2; break;
                        }
                    }
                    return processCommand(condRes ? tp.content : fp.content, true);
                }

                /* --------- functional --------- */
                if (command === 'functional') {
                    if (rest === '') {
                        if (Object.keys(functions).length === 0) return hint('(no functions defined)');
                        let result = '';
                        for (const name in functions) result += 'function: ' + name + '\n';
                        return result.replace(/\n$/, '');
                    }
                    const callMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*$/i);
                    if (callMatch) {
                        const nameErr = varNameError(callMatch[1]);
                        if (nameErr) return err('functional: ' + nameErr);
                        if (!functions[callMatch[1]]) return err('functional: function "' + callMatch[1] + '" not found');
                        executeSequentialCommands(functions[callMatch[1]]);
                        return '';
                    }
                    const defMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-\s*([\s\S]*)$/);
                    if (defMatch) {
                        const nameErr = varNameError(defMatch[1]);
                        if (nameErr) return err('functional: ' + nameErr);
                        const bodyStr = defMatch[2].trim();
                        if (bodyStr === '') return err('functional: body is empty');
                        const subs = extractSubCommands(bodyStr);
                        if (subs.length === 0) return err('functional: body must be (cmd1)-(cmd2)-...');
                        functions[defMatch[1]] = subs;
                        return '';
                    }
                    return err('functional: bad syntax');
                }

                if (command === 'functional-rename') {
                    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*"([^"]*)"\s*$/);
                    if (!match) return err('functional-rename: bad syntax');
                    const ne1 = varNameError(match[1]); if (ne1) return err('functional-rename: ' + ne1);
                    const ne2 = varNameError(match[2]); if (ne2) return err('functional-rename: ' + ne2);
                    if (!functions[match[1]]) return err('functional-rename: function not found');
                    if (functions[match[2]]) return err('functional-rename: target exists');
                    functions[match[2]] = functions[match[1]];
                    delete functions[match[1]]; return '';
                }
                if (command === 'functional-delete') {
                    let param = rest.trim();
                    if (param === '') return err('functional-delete: missing arg');
                    if (param.toLowerCase() === '=all') { functions = {}; return ''; }
                    if (param.startsWith('=')) param = param.substring(1).trim();
                    if (param.startsWith('"') && param.endsWith('"')) param = param.slice(1, -1);
                    const nameErr = varNameError(param);
                    if (nameErr) return err('functional-delete: ' + nameErr);
                    if (!functions[param]) return err('functional-delete: function not found');
                    delete functions[param]; return '';
                }
                if (command === 'functional-replace') {
                    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-\s*([\s\S]*)$/);
                    if (!match) return err('functional-replace: bad syntax');
                    const nameErr = varNameError(match[1]);
                    if (nameErr) return err('functional-replace: ' + nameErr);
                    if (!functions[match[1]]) return err('functional-replace: function not found');
                    const bodyStr = match[2].trim();
                    if (bodyStr === '') return err('functional-replace: body is empty');
                    const subs = extractSubCommands(bodyStr);
                    if (subs.length === 0) return err('functional-replace: bad body');
                    functions[match[1]] = subs; return '';
                }

                return err('unknown command "' + command + '". Type "help" or "cs-help" for commands.');
            }

            /* Input & render events */
            terminal.addEventListener('click', () => hiddenInput.focus());
            terminal.addEventListener('wheel', e => e.preventDefault(), { passive: false });

            hiddenInput.addEventListener('input', function(e) {
                if (pendingInput && (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec')) {
                    e.target.value = '';
                    currentInput = '';
                    return;
                }
                const val = e.target.value;
                const filtered = sanitizeAscii(val);
                if (filtered !== val) hiddenInput.value = filtered;
                currentInput = filtered;
                render();
            });

            hiddenInput.addEventListener('keydown', function(e) {
                if (pendingInput && (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec')) {
                    e.preventDefault();
                    handleLongPressDown(e.key);
                    return;
                }

                if (e.key === 'Enter') {
                    if (e.shiftKey) {
                        e.preventDefault();
                        currentInput += '\n';
                        hiddenInput.value = currentInput;
                        render();
                        return;
                    }
                    e.preventDefault();
                    const cleanInput = sanitizeAscii(currentInput.replace(/[\r\n]/g, ''));

                    if (pendingInput) {
                        if (pendingInput.kind === 'choose') {
                            const optName = cleanInput.trim();
                            if (!pendingInput.options.hasOwnProperty(optName)) {
                                outputLines.push('<span class="hint-msg">That option does not exist. Please enter a valid option.</span>');
                                currentInput = ''; hiddenInput.value = '';
                                render();
                                return;
                            }
                            const optValue = pendingInput.options[optName];
                            const varName = pendingInput.varName;
                            const type = pendingInput.type;
                            const color = pendingInput.color;
                            if (type === 'text') {
                                variables[varName] = { type: 'text', value: optValue };
                            } else {
                                const num = parseFloat(optValue);
                                variables[varName] = { type: 'number', value: isNaN(num) ? 0 : num };
                            }
                            if (color) variables[varName].color = color;
                            pendingInput = null; currentInput = ''; hiddenInput.value = '';
                            render();
                        } else if (pendingInput.kind === 'choose-exec') {
                            const optName = cleanInput.trim();
                            const opt = pendingInput.options.find(o => o.name === optName);
                            if (!opt) {
                                outputLines.push('<span class="hint-msg">That option does not exist. Please enter a valid option.</span>');
                                currentInput = ''; hiddenInput.value = '';
                                render();
                                return;
                            }
                            pendingInput = null;
                            currentInput = ''; hiddenInput.value = '';
                            const output = processCommand(opt.cmd, true);
                            if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
                            render();
                        } else {
                            const varName = pendingInput.varName;
                            const type = pendingInput.type;
                            const color = pendingInput.color;
                            if (type === 'text') {
                                variables[varName] = { type: 'text', value: cleanInput };
                            } else {
                                const num = parseFloat(cleanInput);
                                if (isNaN(num)) {
                                    outputLines.push(err('input: "' + cleanInput + '" is not a valid number; variable "' + varName + '" was set to 0'));
                                    variables[varName] = { type: 'number', value: 0 };
                                } else {
                                    variables[varName] = { type: 'number', value: num };
                                }
                            }
                            if (color) variables[varName].color = color;
                            pendingInput = null; currentInput = ''; hiddenInput.value = '';
                            render();
                        }
                    } else {
                        const trimmedInput = cleanInput.trim();
                        if (trimmedInput.startsWith(';') || trimmedInput.startsWith('#')) {
                            currentInput = ''; hiddenInput.value = '';
                            render();
                            return;
                        }
                        outputLines.push(PROMPT + escapeHtml(cleanInput));
                        const output = processCommand(cleanInput, false);
                        if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
                        currentInput = ''; hiddenInput.value = '';
                        render();
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    terminal.scrollTop -= 40;
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    terminal.scrollTop += 40;
                }
            });

            hiddenInput.addEventListener('keyup', function(e) {
                if (pendingInput && (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec')) {
                    e.preventDefault();
                    handleLongPressUp(e.key);
                }
            });

            window.addEventListener('blur', function() {
                if (pendingInput && (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec') && pendingInput.pressedKey) {
                    if (pendingInput.timers && pendingInput.timers.length) {
                        for (const t of pendingInput.timers) clearTimeout(t);
                    }
                    pendingInput.timers = [];
                    pendingInput.pressedKey = null;
                    pendingInput.triggered = false;
                    render();
                }
            });

            hiddenInput.addEventListener('blur', () => setTimeout(() => hiddenInput.focus(), 0));

            render();
            hiddenInput.focus();
        })();
    </script>
</body>
</html>
