    const subs = extractSubCommands(rem);
    if (subs.length === 0) return err('while: -do(...) must contain at least one command');
    while (condRes.value.check()) {
        for (let i = 0; i < subs.length; i++) {
            const output = processCommand(subs[i], true);
            if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
        }
    }
    render();
    return '';
}, CONT_WHILE);

defineCommand('random', function(rest) {
    const trimmedRest = rest.trim();
    const textRandomMatch = trimmedRest.match(/^"(\d+)"\s*-\s*text\s*([\s\S]*)$/);
    if (textRandomMatch) {
        const count = parseInt(textRandomMatch[1], 10);
        const texts = [];
        const ms = textRandomMatch[2].match(/"([^"]*)"/g);
        if (ms) for (const m of ms) texts.push(m.slice(1, -1));
        if (texts.length === 0) return err('random: no texts');
        if (count <= 0) return err('random: count must be positive');
        if (count > texts.length) return err('random: count > texts');
        const idx = [...Array(texts.length).keys()];
        for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
        return idx.slice(0, count).map(i => texts[i]).join('\n');
    }
    const numRandomMatch = trimmedRest.match(/^"(\d+)"\s*-\s*number\s*"(-?\d+)"\s*-\s*"(-?\d+)"\s*$/);
    if (numRandomMatch) {
        const count = parseInt(numRandomMatch[1], 10);
        const min = parseInt(numRandomMatch[2], 10), max = parseInt(numRandomMatch[3], 10);
        if (min > max) return err('random: min > max');
        const rangeSize = max - min + 1;
        if (count <= 0) return err('random: count must be positive');
        if (count > rangeSize) return err('random: count > range');
        const pool = []; for (let i = min; i <= max; i++) pool.push(i);
        for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
        return pool.slice(0, count).join('\n');
    }
    const multiRM = trimmedRest.match(/^"(\d+)"\s*-\s*(\([\s\S]*)$/);
    if (multiRM) {
        const count = parseInt(multiRM[1], 10);
        const subs = extractSubCommands(multiRM[2].trim());
        if (subs.length === 0) return err('random: bad command list');
        if (count <= 0) return err('random: count must be positive');
        if (count > subs.length) return err('random: count > commands');
        const idx = [...Array(subs.length).keys()];
        for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
        executeSequentialCommands(idx.slice(0, count).map(i => subs[i]));
        return '';
    }
    if (trimmedRest.startsWith('(')) {
        const subs = extractSubCommands(trimmedRest);
        if (subs.length === 0) return err('random: bad command list');
        return processCommand(subs[Math.floor(Math.random() * subs.length)], true);
    }
    if (rest.toLowerCase() === '-uuid') return generateUUID();
    const params = [];
    const ms = rest.match(/"([^"]*)"/g);
    if (ms) for (const m of ms) params.push(m.slice(1, -1));
    if (params.length < 2) return err('random: need at least 2 args');
    const allInts = params.every(p => /^-?\d+$/.test(p));
    if (params.length === 2 && allInts) {
        const min = parseInt(params[0], 10), max = parseInt(params[1], 10);
        if (min > max) return err('random: min > max');
        return String(Math.floor(Math.random() * (max - min + 1)) + min);
    }
    return params[Math.floor(Math.random() * params.length)];
});

defineCommand('repeat', function(rest) {
    let count = null, innerCmd = null;
    const litRepeat = rest.match(/^"(\d+)"\s*-\s*(.*)$/i);
    const varRepeat = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-\s*(.*)$/i);
    if (litRepeat) { count = parseInt(litRepeat[1], 10); innerCmd = litRepeat[2].trim(); }
    else if (varRepeat) {
        const nameErr = varNameError(varRepeat[1]);
        if (nameErr) return err('repeat: ' + nameErr);
        if (!variables[varRepeat[1]]) return err('repeat: variable not found');
        if (variables[varRepeat[1]].type !== 'number') return err('repeat: variable not number');
        count = variables[varRepeat[1]].value;
        innerCmd = varRepeat[2].trim();
    } else return err('repeat: bad syntax');
    if (!Number.isInteger(count) || count <= 0) return err('repeat: count must be positive integer');
    if (innerCmd === '') return err('repeat: missing command');
    const timeM = innerCmd.match(/^time\s*(?:"(\d+)"|\[\s*"([^"]+)"\s*\])\s*-\s*(.*)$/i);
    if (timeM) {
        let delay;
        if (timeM[1]) delay = parseInt(timeM[1], 10);
        else {
            if (!variables[timeM[2]]) return err('repeat: time var not found');
            if (variables[timeM[2]].type !== 'number') return err('repeat: time var not number');
            delay = variables[timeM[2]].value;
        }
        const actualCmd = timeM[3].trim();
        if (actualCmd === '') return err('repeat: missing command');
        let ex = 0;
        function sched() {
            if (ex >= count) return;
            setTimeout(() => {
                const output = processCommand(actualCmd, true);
                if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
                ex++; sched(); render();
            }, delay * 1000);
        }
        sched();
        return 'Scheduled ' + count + ' times every ' + delay + 's';
    } else {
        let combinedOutput = '';
        for (let i = 0; i < count; i++) {
            const output = processCommand(innerCmd, true);
            if (output !== '') combinedOutput += output + '\n';
        }
        return combinedOutput.replace(/\n$/, '');
    }
});

defineCommand('if', function(rest) {
    const condRes = buildCondition(rest, 'if');
    if (!condRes.ok) return err(condRes.error);
    let rem = condRes.value.remaining;
    const trueMatch = rem.match(/^-\s*true\s*=\s*/i);
    if (!trueMatch) return err('if: missing "-true=" branch');
    rem = rem.substring(trueMatch[0].length);
    const trueR = parseBranch(rem, 'if', '-true=');
    if (!trueR.ok) return err(trueR.error);
    const trueBranch = trueR.branch;
    rem = rem.substring(trueR.endPos).trim();
    const falseMatch = rem.match(/^-\s*false\s*=\s*/i);
    if (!falseMatch) return err('if: missing "-false=" branch');
    rem = rem.substring(falseMatch[0].length);
    const falseR = parseBranch(rem, 'if', '-false=');
    if (!falseR.ok) return err(falseR.error);
    const falseBranch = falseR.branch;
    rem = rem.substring(falseR.endPos).trim();
    if (rem !== '') return err('if: unexpected trailing text "' + rem + '"');
    if (trueBranch === null && falseBranch === null) return err('if: both branches cannot be (null)');
    const condValue = condRes.value.check();
    const branchCmd = condValue ? trueBranch : falseBranch;
    if (branchCmd === null) return '';
    return processCommand(branchCmd, true);
}, CONT_IF);

defineCommand('functional', function(rest) {
    if (rest === '') {
        if (Object.keys(functions).length === 0) return hint('(no functions defined)');
        let result = '';
        for (const name in functions) result += 'function: ' + name + '\n';
        return result.replace(/\n$/, '');
    }
    const callMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*$/i);
    if (callMatch) {
        const nameErr = varNameError(callMatch[1]);
        if (nameErr) return err('functional: ' + nameErr);
        if (!functions[callMatch[1]]) return err('functional: function "' + callMatch[1] + '" not found');
        executeSequentialCommands(functions[callMatch[1]]);
        return '';
    }
    const defMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-\s*([\s\S]*)$/);
    if (defMatch) {
        const nameErr = varNameError(defMatch[1]);
        if (nameErr) return err('functional: ' + nameErr);
        const bodyStr = defMatch[2].trim();
        if (bodyStr === '') return err('functional: body is empty');
        const subs = extractSubCommands(bodyStr);
        if (subs.length === 0) return err('functional: body must be (cmd1)-(cmd2)-...');
        functions[defMatch[1]] = subs;
        return '';
    }
    return err('functional: bad syntax');
});
defineCommand('functional-rename', function(rest) {
    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*"([^"]*)"\s*$/);
    if (!match) return err('functional-rename: bad syntax');
    const ne1 = varNameError(match[1]); if (ne1) return err('functional-rename: ' + ne1);
    const ne2 = varNameError(match[2]); if (ne2) return err('functional-rename: ' + ne2);
    if (!functions[match[1]]) return err('functional-rename: function not found');
    if (functions[match[2]]) return err('functional-rename: target exists');
    functions[match[2]] = functions[match[1]];
    delete functions[match[1]];
    return '';
});
defineCommand('functional-delete', function(rest) {
    let param = rest.trim();
    if (param === '') return err('functional-delete: missing arg');
    if (param.toLowerCase() === '=all') { functions = {}; return ''; }
    if (param.startsWith('=')) param = param.substring(1).trim();
    if (param.startsWith('"') && param.endsWith('"')) param = param.slice(1, -1);
    const nameErr = varNameError(param);
    if (nameErr) return err('functional-delete: ' + nameErr);
    if (!functions[param]) return err('functional-delete: function not found');
    delete functions[param];
    return '';
});
defineCommand('functional-replace', function(rest) {
    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-\s*([\s\S]*)$/);
    if (!match) return err('functional-replace: bad syntax');
    const nameErr = varNameError(match[1]);
    if (nameErr) return err('functional-replace: ' + nameErr);
    if (!functions[match[1]]) return err('functional-replace: function not found');
    const bodyStr = match[2].trim();
    if (bodyStr === '') return err('functional-replace: body is empty');
    const subs = extractSubCommands(bodyStr);
    if (subs.length === 0) return err('functional-replace: bad body');
    functions[match[1]] = subs;
    return '';
});

defineCommand('list', function(rest) {
    if (rest === '') {
        if (Object.keys(lists).length === 0) return hint('(no lists defined)');
        let result = '';
        for (const name in lists) {
            result += 'list: ' + name + '\n';
            for (const itemName in lists[name]) result += '  ' + itemName + ' = ' + lists[name][itemName] + '\n';
        }
        return result.replace(/\n$/, '');
    }
    const dynamicIndexMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*=\s*\[\s*"([^"]+)"\s*\]\s*$/);
    if (dynamicIndexMatch) {
        const listName = dynamicIndexMatch[1], varName = dynamicIndexMatch[2];
        if (!lists[listName]) return err('list: list "' + listName + '" not found');
        const ne = varNameError(varName);
        if (ne) return err('list: ' + ne);
        if (!variables[varName]) return err('list: variable "' + varName + '" not found');
        const v = variables[varName];
        let itemName;
        if (v.type === 'number') { const f = formatNumber(v.value); itemName = (f === null) ? String(v.value) : f; }
        else itemName = String(v.value);
        if (!lists[listName].hasOwnProperty(itemName)) return err('list: item "' + itemName + '" not found');
        return processCommand(lists[listName][itemName], true);
    }
    const accessMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*"([^"]*)"\s*$/);
    if (accessMatch) {
        const listName = accessMatch[1], itemName = accessMatch[2];
        if (!lists[listName]) return err('list: list "' + listName + '" not found');
        if (!lists[listName].hasOwnProperty(itemName)) return err('list: item "' + itemName + '" not found');
        return processCommand(lists[listName][itemName], true);
    }
    const createMatch = rest.match(/^\[\s*"([^"]+)"\s*\]([\s\S]*)$/i);
    if (!createMatch) return err('list: bad syntax');
    const listName = createMatch[1];
    let itemsPart = createMatch[2].trim();
    const nameErr = varNameError(listName);
    if (nameErr) return err('list: ' + nameErr);
    if (lists[listName]) return err('list: list already exists');
    if (itemsPart === '') { lists[listName] = {}; return ''; }
    const items = {};
    while (itemsPart.length > 0) {
        itemsPart = itemsPart.trim();
        if (!itemsPart.startsWith('-')) return err('list: expected "-" before item definition');
        itemsPart = itemsPart.substring(1).trim();
        const nameRes = matchItemName(itemsPart);
        if (!nameRes) return err('list: expected item name');
        const resolved = resolveItemName(nameRes, 'list');
        if (!resolved.ok) return err(resolved.error);
        const itemName = resolved.name;
        itemsPart = itemsPart.substring(nameRes.length).trim();
        if (items.hasOwnProperty(itemName)) return err('list: duplicate item "' + itemName + '"');
        if (itemsPart[0] !== '(') return err('list: expected "(" after item name');
        const pr = extractParenthesized(itemsPart, 0);
        if (!pr) return err('list: missing ")"');
        items[itemName] = pr.content;
        itemsPart = itemsPart.substring(pr.endPos).trim();
    }
    lists[listName] = items;
    return '';
});
defineCommand('list-add', function(rest) {
    const lMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*([\s\S]*)$/i);
    if (!lMatch) return err('list-add: bad syntax');
    const listName = lMatch[1];
    let remaining = lMatch[2].trim();
    if (!lists[listName]) return err('list-add: list "' + listName + '" not found');
    if (!remaining.startsWith('-')) return err('list-add: expected "-" before item name');
    remaining = remaining.substring(1).trim();
    const nameRes = matchItemName(remaining);
    if (!nameRes) return err('list-add: expected item name');
    const resolved = resolveItemName(nameRes, 'list-add');
    if (!resolved.ok) return err(resolved.error);
    const itemName = resolved.name;
    remaining = remaining.substring(nameRes.length).trim();
    if (lists[listName].hasOwnProperty(itemName)) return err('list-add: item "' + itemName + '" already exists');
    if (remaining[0] !== '(') return err('list-add: expected "("');
    const pr = extractParenthesized(remaining, 0);
    if (!pr) return err('list-add: missing ")"');
    const after = remaining.substring(pr.endPos).trim();
    if (after !== '') return err('list-add: unexpected trailing text');
    lists[listName][itemName] = pr.content;
    return '';
});
defineCommand('list-delete', function(rest) {
    let param = rest.trim();
    if (param === '') return err('list-delete: missing argument');
    if (param.toLowerCase() === '=all') { lists = {}; return ''; }
    const allMatch = param.match(/^\[\s*"([^"]+)"\s*\]\s*=\s*all\s*$/i);
    if (allMatch) {
        const listName = allMatch[1];
        if (!lists[listName]) return err('list-delete: list "' + listName + '" not found');
        lists[listName] = {};
        return '';
    }
    const dynMatch = param.match(/^\[\s*"([^"]+)"\s*\]\s*=\s*\[\s*"([^"]+)"\s*\]\s*$/);
    if (dynMatch) {
        const listName = dynMatch[1], varName = dynMatch[2];
        if (!lists[listName]) return err('list-delete: list "' + listName + '" not found');
        const ne = varNameError(varName);
        if (ne) return err('list-delete: ' + ne);
        if (!variables[varName]) return err('list-delete: variable "' + varName + '" not found');
        const v = variables[varName];
        let itemName;
        if (v.type === 'number') { const f = formatNumber(v.value); itemName = (f === null) ? String(v.value) : f; }
        else itemName = String(v.value);
        if (!lists[listName].hasOwnProperty(itemName)) return err('list-delete: item "' + itemName + '" not found');
        delete lists[listName][itemName];
        return '';
    }
    const litMatch = param.match(/^\[\s*"([^"]+)"\s*\]\s*"([^"]*)"\s*$/);
    if (litMatch) {
        const listName = litMatch[1], itemName = litMatch[2];
        if (!lists[listName]) return err('list-delete: list "' + listName + '" not found');
        if (!lists[listName].hasOwnProperty(itemName)) return err('list-delete: item "' + itemName + '" not found');
        delete lists[listName][itemName];
        return '';
    }
    return err('list-delete: bad syntax');
});
defineCommand('list-rename', function(rest) {
    let remaining = rest.trim();
    if (remaining === '') return err('list-rename: bad syntax');
    const oldRes = parseNameExpr(remaining);
    if (!oldRes) return err('list-rename: expected old list name');
    remaining = remaining.substring(oldRes.length).trim();
    const newRes = parseNameExpr(remaining);
    if (!newRes) return err('list-rename: expected new list name');
    remaining = remaining.substring(newRes.length).trim();
    if (remaining !== '') return err('list-rename: unexpected trailing text');
    const oldR = resolveNameExpr(oldRes, 'list-rename');
    if (!oldR.ok) return err(oldR.error);
    const newR = resolveNameExpr(newRes, 'list-rename');
    if (!newR.ok) return err(newR.error);
    const oldName = oldR.name, newName = newR.name;
    const nameErr1 = varNameError(oldName);
    if (nameErr1) return err('list-rename: ' + nameErr1);
    const nameErr2 = varNameError(newName);
    if (nameErr2) return err('list-rename: ' + nameErr2);
    if (!lists[oldName]) return err('list-rename: list "' + oldName + '" not found');
    if (lists[newName]) return err('list-rename: list "' + newName + '" already exists');
    lists[newName] = lists[oldName];
    delete lists[oldName];
    return '';
});
defineCommand('list-replace', function(rest) {
    const lMatch = rest.match(/^\[\s*"([^"]+)"\s*\]\s*([\s\S]*)$/i);
    if (!lMatch) return err('list-replace: bad syntax');
    const listName = lMatch[1];
    let remaining = lMatch[2].trim();
    if (!lists[listName]) return err('list-replace: list "' + listName + '" not found');
    if (remaining.startsWith('-')) remaining = remaining.substring(1).trim();
    const oldNameRes = matchItemName(remaining);
    if (!oldNameRes) return err('list-replace: expected old item name');
    const oldResolved = resolveItemName(oldNameRes, 'list-replace');
    if (!oldResolved.ok) return err(oldResolved.error);
    const oldName = oldResolved.name;
    remaining = remaining.substring(oldNameRes.length).trim();
    if (!remaining.startsWith('-')) return err('list-replace: expected "-" between old and new item name');
    remaining = remaining.substring(1).trim();
    const newNameRes = matchItemName(remaining);
    if (!newNameRes) return err('list-replace: expected new item name');
    const newResolved = resolveItemName(newNameRes, 'list-replace');
    if (!newResolved.ok) return err(newResolved.error);
    const newName = newResolved.name;
    remaining = remaining.substring(newNameRes.length).trim();
    if (remaining.startsWith('=')) remaining = remaining.substring(1).trim();
    if (remaining[0] !== '(') return err('list-replace: expected "(" or "=(" before the command');
    const pr = extractParenthesized(remaining, 0);
    if (!pr) return err('list-replace: missing closing ")"');
    const newCmd = pr.content;
    const after = remaining.substring(pr.endPos).trim();
    if (after !== '') return err('list-replace: unexpected trailing text');
    if (!lists[listName].hasOwnProperty(oldName)) return err('list-replace: item "' + oldName + '" not found');
    if (newName !== oldName && lists[listName].hasOwnProperty(newName)) return err('list-replace: item "' + newName + '" already exists');
    delete lists[listName][oldName];
    lists[listName][newName] = newCmd;
    return '';
});

/* ================================================================
   PLUGIN SYSTEM
   ================================================================ */

function parsePluginParams(rest, params, cmdName) {
    const result = {};
    let i = 0;
    const len = rest.length;
    for (const p of params) {
        while (i < len && /\s/.test(rest[i])) i++;
        if (i < len && rest[i] === '-') { i++; while (i < len && /\s/.test(rest[i])) i++; }
        let value;
        if (i < len && rest[i] === '"') {
            let j = i + 1;
            while (j < len && rest[j] !== '"') j++;
            if (j >= len) return fail('param "' + p.name + '": unterminated string');
            value = rest.slice(i + 1, j);
            i = j + 1;
        } else if (p.quoted) {
            return fail('param "' + p.name + '": expected quoted string');
        } else {
            let j = i;
            while (j < len && !/\s/.test(rest[j]) && rest[j] !== '-') j++;
            if (j === i) return fail('param "' + p.name + '": missing value');
            value = rest.slice(i, j);
            i = j;
        }
        if (p.type === 'number') {
            if (!isValidNumber(value)) return fail('param "' + p.name + '": "' + value + '" is not a valid number');
        } else if (p.type === 'color') {
            const ce = colorError(value);
            if (ce) return fail('param "' + p.name + '": ' + ce);
        } else if (p.type === 'var') {
            const ne = varNameError(value);
            if (ne) return fail('param "' + p.name + '": ' + ne);
        }
        result[p.name] = value;
    }
    while (i < len && /\s/.test(rest[i])) i++;
    if (i < len) return fail('unexpected trailing text: "' + rest.slice(i, i + 20) + '"');
    return ok(result);
}

function actionTruthy(v) {
    if (typeof v === 'number') return v !== 0;
    const s = String(v).trim();
    if (s === '' || s === '0' || s.toLowerCase() === 'false') return false;
    return true;
}

function evalAction(action, scope, cmdName) {
    if (!action || typeof action !== 'object') return fail('action must be an object');
    const op = action.op;
    const slots = scope.slots;
    function setOut(value) { if (action.out) slots[action.out] = value; return value; }
    function evalChild(node) { return evalAction(node, scope, cmdName); }
    function numOf(node, label) {
        const r = evalChild(node);
        if (!r.ok) return { ok: false, error: r.error };
        const n = parseFloat(r.value);
        if (isNaN(n)) return { ok: false, error: label + ' must be a number' };
        return { ok: true, value: n };
    }

    switch (op) {
        /* ---- core ---- */
        case 'literal':
            return ok(String(action.value === undefined ? '' : action.value));
        case 'param': {
            if (!Object.prototype.hasOwnProperty.call(scope.params, action.name)) {
                return fail('param "' + action.name + '" not declared');
            }
            return ok(scope.params[action.name]);
        }
        case 'concat': {
            const args = Array.isArray(action.args) ? action.args : [];
            let out = '';
            for (const a of args) {
                const r = evalChild(a);
                if (!r.ok) return r;
                out += String(r.value);
            }
            return ok(setOut(out));
        }
        case 'add': case 'sub': case 'mul': case 'div': {
            const ra = numOf(action.a, op + ': a'); if (!ra.ok) return ra;
            const rb = numOf(action.b, op + ': b'); if (!rb.ok) return rb;
            const a = ra.value, b = rb.value;
            let result;
            if (op === 'add') result = a + b;
            else if (op === 'sub') result = a - b;
            else if (op === 'mul') result = a * b;
            else {
                if (b === 0) return fail('div: division by zero');
                result = a / b;
            }
            return ok(setOut(formatNumber(result)));
        }
        case 'double': {
            const r = numOf(action.in, 'double: in');
            if (!r.ok) return r;
            return ok(setOut(formatNumber(r.value * 2)));
        }
        case 'length': {
            const r = evalChild(action.in); if (!r.ok) return r;
            return ok(setOut(String(r.value).length));
        }
        case 'upper': {
            const r = evalChild(action.in); if (!r.ok) return r;
            return ok(setOut(String(r.value).toUpperCase()));
        }
        case 'lower': {
            const r = evalChild(action.in); if (!r.ok) return r;
            return ok(setOut(String(r.value).toLowerCase()));
        }
        case 'getVar': {
            const name = action.name;
            const ne = varNameError(name);
            if (ne) return fail('getVar: ' + ne);
            if (!variables[name]) return fail('getVar: variable "' + name + '" not found');
            const v = variables[name];
            let val;
            if (v.type === 'number') { const f = formatNumber(v.value); val = (f === null) ? String(v.value) : f; }
            else val = String(v.value);
            return ok(setOut(val));
        }
        case 'setVar': {
            const name = action.name;
            const ne = varNameError(name);
            if (ne) return fail('setVar: ' + ne);
            const rv = evalChild(action.value); if (!rv.ok) return rv;
            const type = (action.type || 'text').toLowerCase();
            if (type === 'number') {
                const n = parseFloat(rv.value);
                if (isNaN(n)) return fail('setVar: value is not a valid number');
                variables[name] = { type: 'number', value: n };
            } else {
                variables[name] = { type: 'text', value: String(rv.value) };
            }
            if (action.color) {
                const ce = colorError(action.color);
                if (ce) return fail('setVar: ' + ce);
                variables[name].color = action.color;
            }
            return ok(setOut(variables[name].value));
        }
        case 'color': {
            const ce = colorError(action.color);
            if (ce) return fail('color: ' + ce);
            const rt = evalChild(action.text); if (!rt.ok) return rt;
            const html = '<span style="color: ' + COLOR_MAP[action.color] + '">' + escapeHtml(String(rt.value)) + '</span>';
            return ok(setOut(html));
        }
        case 'if': {
            const rc = evalChild(action.cond); if (!rc.ok) return rc;
            const branch = actionTruthy(rc.value) ? action.then : action.else;
            let result = '';
            if (branch !== undefined && branch !== null) {
                const rb = evalChild(branch); if (!rb.ok) return rb;
                result = rb.value;
            }
            return ok(setOut(result));
        }
        case 'emit': {
            const r = evalChild(action.value); if (!r.ok) return r;
            return ok(setOut(r.value));
        }

        /* ---- logic ---- */
        case 'eq': case 'ne': case 'lt': case 'gt': case 'le': case 'ge': {
            const ra = evalChild(action.a); if (!ra.ok) return ra;
            const rb = evalChild(action.b); if (!rb.ok) return rb;
            const a = ra.value, b = rb.value;
            const an = parseFloat(a), bn = parseFloat(b);
            const num = !isNaN(an) && !isNaN(bn);
            let res;
            if (num) {
                if (op === 'eq') res = an === bn;
                else if (op === 'ne') res = an !== bn;
                else if (op === 'lt') res = an < bn;
                else if (op === 'gt') res = an > bn;
                else if (op === 'le') res = an <= bn;
                else res = an >= bn;
            } else {
                const sa = String(a), sb = String(b);
                if (op === 'eq') res = sa === sb;
                else if (op === 'ne') res = sa !== sb;
                else if (op === 'lt') res = sa < sb;
                else if (op === 'gt') res = sa > sb;
                else if (op === 'le') res = sa <= sb;
                else res = sa >= sb;
            }
            return ok(setOut(res ? '1' : '0'));
        }
        case 'and': case 'or': {
            let args = Array.isArray(action.args) ? action.args : null;
            if (!args) {
                args = [];
                if (action.a !== undefined) args.push(action.a);
                if (action.b !== undefined) args.push(action.b);
            }
            let res = op === 'and';
            for (const a of args) {
                const r = evalChild(a); if (!r.ok) return r;
                const t = actionTruthy(r.value);
                if (op === 'and' && !t) { res = false; break; }
                if (op === 'or' && t) { res = true; break; }
            }
            return ok(setOut(res ? '1' : '0'));
        }
        case 'not': {
            const r = evalChild(action.in); if (!r.ok) return r;
            return ok(setOut(actionTruthy(r.value) ? '0' : '1'));
        }
        case 'try': {
            const r = evalChild(action.attempt);
            if (r.ok) return ok(setOut(r.value));
            if (action.fallback === undefined) return ok(setOut(''));
            const rf = evalChild(action.fallback);
            if (!rf.ok) return rf;
            return ok(setOut(rf.value));
        }
        case 'seq': {
            const args = Array.isArray(action.args) ? action.args : [];
            let result = '';
            for (const a of args) {
                const r = evalChild(a); if (!r.ok) return r;
                result = r.value;
            }
            return ok(setOut(result));
        }

        /* ---- math ---- */
        case 'mod': {
            const ra = numOf(action.a, 'mod: a'); if (!ra.ok) return ra;
            const rb = numOf(action.b, 'mod: b'); if (!rb.ok) return rb;
            if (rb.value === 0) return fail('mod: division by zero');
            return ok(setOut(formatNumber(ra.value % rb.value)));
        }
        case 'pow': {
            const ra = numOf(action.a, 'pow: a'); if (!ra.ok) return ra;
            const rb = numOf(action.b, 'pow: b'); if (!rb.ok) return rb;
            return ok(setOut(formatNumber(Math.pow(ra.value, rb.value))));
        }
        case 'abs': case 'floor': case 'ceil': case 'round': {
            const r = numOf(action.in, op + ': in');
            if (!r.ok) return r;
            let v;
            if (op === 'abs') v = Math.abs(r.value);
            else if (op === 'floor') v = Math.floor(r.value);
            else if (op === 'ceil') v = Math.ceil(r.value);
            else v = Math.round(r.value);
            return ok(setOut(formatNumber(v)));
        }
        case 'min': case 'max': {
            let args = Array.isArray(action.args) ? action.args : null;
            if (!args) {
                args = [];
                if (action.a !== undefined) args.push(action.a);
                if (action.b !== undefined) args.push(action.b);
            }
            if (args.length === 0) return fail(op + ': no args');
            const nums = [];
            for (const a of args) {
                const r = numOf(a, op + ': arg'); if (!r.ok) return r;
                nums.push(r.value);
            }
            return ok(setOut(formatNumber(op === 'min' ? Math.min.apply(null, nums) : Math.max.apply(null, nums))));
        }
        case 'randomInt': {
            const lo = numOf(action.min, 'randomInt: min'); if (!lo.ok) return lo;
            const hi = numOf(action.max, 'randomInt: max'); if (!hi.ok) return hi;
            const l = Math.ceil(lo.value), h = Math.floor(hi.value);
            if (l > h) return fail('randomInt: min > max');
            return ok(setOut(String(Math.floor(Math.random() * (h - l + 1)) + l)));
        }
        case 'randomUUID':
            return ok(setOut(generateUUID()));

        /* ---- string ---- */
        case 'trim': {
            const r = evalChild(action.in); if (!r.ok) return r;
            return ok(setOut(String(r.value).trim()));
        }
        case 'substr': {
            const rs = evalChild(action.in); if (!rs.ok) return rs;
            const startR = numOf(action.start, 'substr: start'); if (!startR.ok) return startR;
            let end = null;
            if (action.end !== undefined) {
                const endR = numOf(action.end, 'substr: end'); if (!endR.ok) return endR;
                end = endR.value;
            }
            const s = String(rs.value);
            const st = Math.trunc(startR.value);
            if (end === null) return ok(setOut(s.slice(st)));
            return ok(setOut(s.slice(st, Math.trunc(end))));
        }
        case 'replace': {
            const rs = evalChild(action.in); if (!rs.ok) return rs;
            const rf = evalChild(action.from); if (!rf.ok) return rf;
            const rt = evalChild(action.to); if (!rt.ok) return rt;
            const from = String(rf.value);
            if (from === '') return fail('replace: "from" cannot be empty');
            return ok(setOut(String(rs.value).split(from).join(String(rt.value))));
        }
        case 'split': {
            const rs = evalChild(action.in); if (!rs.ok) return rs;
            const rsep = evalChild(action.sep); if (!rsep.ok) return rsep;
            return ok(setOut(String(rs.value).split(String(rsep.value)).join('\n')));
        }
        case 'indexOf': {
            const rs = evalChild(action.in); if (!rs.ok) return rs;
            const rn = evalChild(action.needle); if (!rn.ok) return rn;
            return ok(setOut(String(String(rs.value).indexOf(String(rn.value)))));
        }
        case 'repeatStr': {
            const rs = evalChild(action.in); if (!rs.ok) return rs;
            const rc = numOf(action.count, 'repeatStr: count'); if (!rc.ok) return rc;
            const n = Math.trunc(rc.value);
            if (n < 0) return fail('repeatStr: count must be >= 0');
            if (n > 10000) return fail('repeatStr: count too large (max 10000)');
            return ok(setOut(String(rs.value).repeat(n)));
        }

        /* ---- lists ---- */
        case 'listAdd': {
            const listName = action.list;
            if (typeof listName !== 'string' || !/^[A-Za-z_][A-Za-z0-9_]*$/.test(listName)) {
                return fail('listAdd: invalid list name');
            }
            if (!lists[listName]) lists[listName] = {};
            const rk = evalChild(action.key); if (!rk.ok) return rk;
            const rv = evalChild(action.value); if (!rv.ok) return rv;
            lists[listName][String(rk.value)] = String(rv.value);
            return ok(setOut(String(rv.value)));
        }
        case 'listGet': {
            const listName = action.list;
            if (!lists[listName]) return fail('listGet: list "' + listName + '" not found');
            const rk = evalChild(action.key); if (!rk.ok) return rk;
            const key = String(rk.value);
            if (!Object.prototype.hasOwnProperty.call(lists[listName], key)) {
                return fail('listGet: item "' + key + '" not found');
            }
            return ok(setOut(lists[listName][key]));
        }
        case 'listHas': {
            const listName = action.list;
            const rk = evalChild(action.key); if (!rk.ok) return rk;
            const has = !!(lists[listName] && Object.prototype.hasOwnProperty.call(lists[listName], String(rk.value)));
            return ok(setOut(has ? '1' : '0'));
        }
        case 'listDelete': {
            const listName = action.list;
            if (!lists[listName]) return fail('listDelete: list "' + listName + '" not found');
            const rk = evalChild(action.key); if (!rk.ok) return rk;
            delete lists[listName][String(rk.value)];
            return ok(setOut(''));
        }
        case 'listKeys': {
            const listName = action.list;
            if (!lists[listName]) return ok(setOut(''));
            return ok(setOut(Object.keys(lists[listName]).join('\n')));
        }
        case 'listCount': {
            const listName = action.list;
            const n = lists[listName] ? Object.keys(lists[listName]).length : 0;
            return ok(setOut(String(n)));
        }

        /* ---- variables ---- */
        case 'getVarType': {
            const name = action.name;
            const ne = varNameError(name);
            if (ne) return fail('getVarType: ' + ne);
            if (!variables[name]) return ok(setOut(''));
            return ok(setOut(variables[name].type));
        }
        case 'delVar': {
            const name = action.name;
            const ne = varNameError(name);
            if (ne) return fail('delVar: ' + ne);
            delete variables[name];
            return ok(setOut(''));
        }

        default:
            return fail('unknown action op "' + op + '"');
    }
}

function registerPluginCommand(spec) {
    if (!spec || typeof spec !== 'object') return fail('command spec must be an object');
    const name = spec.name;
    if (typeof name !== 'string' || !/^[a-z][a-z0-9_-]*$/.test(name)) {
        return fail('invalid command name "' + name + '": must match /^[a-z][a-z0-9_-]*$/');
    }
    if (COMMANDS[name]) return fail('command "' + name + '" conflicts with an existing command');
    const params = Array.isArray(spec.params) ? spec.params : [];
    for (const p of params) {
        if (!p || typeof p !== 'object') return fail('param entry must be an object');
        if (typeof p.name !== 'string' || p.name === '') return fail('param missing "name"');
        if (['text','number','color','var'].indexOf(p.type) === -1) {
            return fail('param "' + p.name + '" has invalid type "' + p.type + '"');
        }
    }
    const conts = [];
    const rawConts = Array.isArray(spec.continuations) ? spec.continuations : [];
    for (const c of rawConts) {
        if (!c || typeof c !== 'object') return fail('continuation entry must be an object');
        if (c.type !== 'flag' && c.type !== 'branch') return fail('continuation type must be "flag" or "branch"');
        if (typeof c.pattern !== 'string') return fail('continuation pattern must be a string');
        if (c.type === 'branch' && !/\\\($/.test(c.pattern)) {
            return fail('branch pattern must end with "\\\\(" (literal open paren)');
        }
        let re;
        try { re = new RegExp(c.pattern, c.flags || ''); }
        catch (e) { return fail('invalid continuation regex: ' + e.message); }
        conts.push({ type: c.type, pattern: re });
    }
    if (!spec.action || typeof spec.action !== 'object') {
        return fail('command "' + name + '" missing action');
    }
    const returns = spec.returns && typeof spec.returns === 'object' ? spec.returns : null;
    const handler = function(rest) {
        const parsed = parsePluginParams(rest, params, name);
        if (!parsed.ok) return err(name + ': ' + parsed.error);
        const scope = { params: parsed.value, slots: {}, plugin: spec };
        const r = evalAction(spec.action, scope, name);
        if (!r.ok) return err(name + ': ' + r.error);
        let output = r.value;
        if (returns && returns.source) {
            if (!Object.prototype.hasOwnProperty.call(scope.slots, returns.source)) {
                return err(name + ': returns.source "' + returns.source + '" not found in slots');
            }
            output = scope.slots[returns.source];
        }
        if (typeof output !== 'string') output = String(output);
        if (returns && returns.color) {
            const ce = colorError(returns.color);
            if (ce) return err(name + ': ' + ce);
            output = '<span style="color: ' + COLOR_MAP[returns.color] + '">' + escapeHtml(output) + '</span>';
        }
        return output;
    };
    defineCommand(name, handler, conts);
    return ok(name);
}

function unloadPlugin(name) {
    const p = loadedPlugins[name];
    if (!p) return false;
    for (const cmd of p.commands) {
        delete COMMANDS[cmd];
        delete COMMAND_CONTINUATIONS[cmd];
    }
    delete loadedPlugins[name];
    _cmdRegexCache = null;
    return true;
}

function loadPluginObject(json) {
    if (!json || typeof json !== 'object' || Array.isArray(json)) {
        return fail('plugin root must be an object');
    }
    if (typeof json.name !== 'string' || json.name === '') {
        return fail('plugin missing "name"');
    }
    if (!Array.isArray(json.commands)) {
        return fail('plugin missing "commands" array');
    }
    if (loadedPlugins[json.name]) {
        unloadPlugin(json.name);
    }
    const registered = [];
    const names = [];
    for (let i = 0; i < json.commands.length; i++) {
        const spec = json.commands[i];
        const r = registerPluginCommand(spec);
        if (!r.ok) {
            for (const n of registered) {
                delete COMMANDS[n];
                delete COMMAND_CONTINUATIONS[n];
            }
            _cmdRegexCache = null;
            const specName = (spec && spec.name) ? spec.name : '?';
            return fail('command #' + (i + 1) + ' (' + specName + '): ' + r.error);
        }
        registered.push(r.value);
        names.push(r.value);
    }
    loadedPlugins[json.name] = { commands: names };
    return ok({ name: json.name, commands: names });
}

async function loadPluginFile(file) {
    const name = file.name || '(unnamed)';
    if (!name.toLowerCase().endsWith('.csplugin')) {
        outputLines.push(err('plugin-load: "' + name + '" must end with .csplugin'));
        render();
        return;
    }
    let text;
    try {
        const buf = await file.arrayBuffer();
        text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
    } catch (e) {
        outputLines.push(err('plugin-load: failed to read file (' + e.message + ')'));
        render();
        return;
    }
    let parsed;
    try { parsed = JSON.parse(text); }
    catch (e) {
        outputLines.push(err('plugin-load: invalid JSON (' + e.message + ')'));
        render();
        return;
    }
    const r = loadPluginObject(parsed);
    if (!r.ok) {
        outputLines.push(err('plugin-load: ' + r.error));
    } else {
        outputLines.push(hint('Plugin "' + r.value.name + '" loaded: ' + r.value.commands.join(', ')));
    }
    render();
}

function openPluginPicker() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csplugin,application/json';
    input.style.display = 'none';
    document.body.appendChild(input);
    let handled = false;
    input.addEventListener('change', async function(e) {
        if (handled) return; handled = true;
        const file = e.target.files && e.target.files[0];
        if (document.body.contains(input)) document.body.removeChild(input);
        if (!file) { setTimeout(() => hiddenInput.focus(), 0); return; }
        try { await loadPluginFile(file); }
        catch (ex) {
            outputLines.push(err('plugin-load: unexpected error (' + ex.message + ')'));
            render();
        }
        setTimeout(() => hiddenInput.focus(), 0);
    });
    input.addEventListener('cancel', function() {
        if (handled) return; handled = true;
        if (document.body.contains(input)) document.body.removeChild(input);
        setTimeout(() => hiddenInput.focus(), 0);
    });
    try { input.click(); }
    catch (e) {
        if (document.body.contains(input)) document.body.removeChild(input);
        outputLines.push(err('plugin-load: could not open file picker (' + e.message + ')'));
        render();
    }
}

/* -- plugin commands -- */
defineCommand('plugin-load', function(rest) {
    if (rest !== '') return err('plugin-load: takes no arguments');
    setTimeout(() => openPluginPicker(), 10);
    return '';
});
defineCommand('plugin-help', function() { return PLUGIN_HELP_TEXT; });
defineCommand('plugin-uninstall', function(rest) {
    let arg = rest.trim();
    if (arg === '') {
        const names = Object.keys(loadedPlugins);
        if (names.length === 0) return hint('(no plugins loaded)');
        let out = '';
        for (const n of names) {
            out += 'plugin: ' + n + '  [' + loadedPlugins[n].commands.join(', ') + ']\n';
        }
        return out.replace(/\n$/, '');
    }
    if (arg.toLowerCase() === '=all') {
        const names = Object.keys(loadedPlugins);
        if (names.length === 0) return hint('(no plugins loaded)');
        for (const n of names) unloadPlugin(n);
        return hint('Unloaded ' + names.length + ' plugin(s): ' + names.join(', '));
    }
    if (arg.startsWith('"') && arg.endsWith('"')) arg = arg.slice(1, -1);
    if (!loadedPlugins[arg]) return err('plugin-uninstall: plugin "' + arg + '" not found');
    const cmds = loadedPlugins[arg].commands.slice();
    unloadPlugin(arg);
    return hint('Plugin "' + arg + '" unloaded: ' + cmds.join(', '));
});

/* ================================================================
   DISPATCHER
   ================================================================ */

function processCommand(input, skipDisplayCommand = false) {
    input = sanitizeAscii(input.trim());
    input = stripComments(input).trim();
    if (input === '') return '';
    const cmdRegex = getCommandRegex();
    const m = cmdRegex ? input.match(cmdRegex) : null;
    if (!m) {
        const word = input.split(/\s+/)[0];
        return err('unknown command "' + word + '". Type "help" or "cs-help" for commands.');
    }
    const name = m[1].toLowerCase();
    const rest = m[2].trim();
    const handler = COMMANDS[name];
    if (!handler) return err('unknown command "' + name + '". Type "help" or "cs-help" for commands.');
    return handler(rest, { skipDisplayCommand: skipDisplayCommand, name: name });
}

/* Input & render events */
terminal.addEventListener('click', () => hiddenInput.focus());
terminal.addEventListener('wheel', e => e.preventDefault(), { passive: false });

hiddenInput.addEventListener('input', function(e) {
    if (pendingInput && (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec')) {
        e.target.value = '';
        currentInput = '';
        return;
    }
    const val = e.target.value;
    const filtered = sanitizeAscii(val);
    if (filtered !== val) hiddenInput.value = filtered;
    currentInput = filtered;
    render();
});

hiddenInput.addEventListener('keydown', function(e) {
    if (pendingInput && (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec')) {
        e.preventDefault();
        handleLongPressDown(e.key);
        return;
    }
    if (e.key === 'Enter') {
        if (e.shiftKey) {
            e.preventDefault();
            currentInput += '\n';
            hiddenInput.value = currentInput;
            render();
            return;
        }
        e.preventDefault();
        let cleanInput = sanitizeAscii(currentInput.replace(/[\r\n]/g, ''));
        if (pendingInput) {
            if (pendingInput.kind === 'choose') {
                const optName = cleanInput.trim();
                if (!pendingInput.options.hasOwnProperty(optName)) {
                    outputLines.push('<span class="hint-msg">That option does not exist. Please enter a valid option.</span>');
                    currentInput = ''; hiddenInput.value = '';
                    render();
                    return;
                }
                const optValue = pendingInput.options[optName];
                const varName = pendingInput.varName;
                const type = pendingInput.type;
                const color = pendingInput.color;
                if (type === 'text') variables[varName] = { type: 'text', value: optValue };
                else {
                    const num = parseFloat(optValue);
                    variables[varName] = { type: 'number', value: isNaN(num) ? 0 : num };
                }
                if (color) variables[varName].color = color;
                pendingInput = null; currentInput = ''; hiddenInput.value = '';
                render();
            } else if (pendingInput.kind === 'choose-exec') {
                const optName = cleanInput.trim();
                const opt = pendingInput.options.find(o => o.name === optName);
                if (!opt) {
                    outputLines.push('<span class="hint-msg">That option does not exist. Please enter a valid option.</span>');
                    currentInput = ''; hiddenInput.value = '';
                    render();
                    return;
                }
                pendingInput = null;
                currentInput = ''; hiddenInput.value = '';
                let cmdOutput = '';
                try { cmdOutput = processCommand(opt.cmd, true); }
                catch (ex) { cmdOutput = err('internal error: ' + ex.message); }
                if (typeof cmdOutput === 'string' && cmdOutput !== '') {
                    cmdOutput.split('\n').forEach(line => outputLines.push(line));
                }
                render();
            } else {
                const varName = pendingInput.varName;
                const type = pendingInput.type;
                const color = pendingInput.color;
                if (type === 'text') variables[varName] = { type: 'text', value: cleanInput };
                else {
                    const num = parseFloat(cleanInput);
                    if (isNaN(num)) {
                        outputLines.push(err('input: "' + cleanInput + '" is not a valid number; variable "' + varName + '" was set to 0'));
                        variables[varName] = { type: 'number', value: 0 };
                    } else variables[varName] = { type: 'number', value: num };
                }
                if (color) variables[varName].color = color;
                pendingInput = null; currentInput = ''; hiddenInput.value = '';
                render();
            }
        } else {
            const displayInput = stripComments(cleanInput).trim();
            if (displayInput === '') {
                currentInput = ''; hiddenInput.value = '';
                render();
                return;
            }
            outputLines.push(PROMPT + escapeHtml(displayInput));
            let output = '';
            try { output = processCommand(displayInput, false); }
            catch (ex) { output = err('internal error: ' + ex.message); }
            if (typeof output === 'string' && output !== '') {
                output.split('\n').forEach(line => outputLines.push(line));
            }
            currentInput = ''; hiddenInput.value = '';
            render();
        }
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        terminal.scrollTop -= 40;
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        terminal.scrollTop += 40;
    }
});

hiddenInput.addEventListener('keyup', function(e) {
    if (pendingInput && (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec')) {
        e.preventDefault();
        handleLongPressUp(e.key);
    }
});

window.addEventListener('blur', function() {
    if (pendingInput && (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec') && pendingInput.pressedKey) {
        if (pendingInput.timers && pendingInput.timers.length) {
            for (const t of pendingInput.timers) clearTimeout(t);
        }
        pendingInput.timers = [];
        pendingInput.pressedKey = null;
        pendingInput.triggered = false;
        render();
    }
});

hiddenInput.addEventListener('blur', () => setTimeout(() => hiddenInput.focus(), 0));

render();
hiddenInput.focus();
})();
</script>
