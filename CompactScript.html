<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompactScript</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: #000000; overflow: hidden;
    font-family: "Courier New", "Lucida Console", "Monaco", monospace;
}
#terminal {
    width: 100%; height: 100%;
    background: #000000; color: #ffffff;
    padding: 16px 20px; font-size: 18px; line-height: 1.5;
    overflow-y: auto; white-space: pre-wrap; word-wrap: break-word;
    outline: none; user-select: text; -webkit-user-select: text;
    caret-color: #ffffff; scrollbar-width: none; -ms-overflow-style: none;
}
#terminal::-webkit-scrollbar { display: none; width: 0; height: 0; }
.cursor-block {
    display: inline-block; width: 10px; height: 20px;
    background: #ffffff; vertical-align: text-bottom;
    margin-left: 1px; animation: blink 1s step-end infinite;
}
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
.err-msg { color: #ff5555; }
.hint-msg { color: #888888; }
#hidden-input {
    position: fixed; left: -9999px; top: -9999px;
    opacity: 0; width: 1px; height: 1px;
    background: transparent; border: none; outline: none;
    color: transparent; caret-color: transparent;
    font-size: 1px; padding: 0; margin: 0; z-index: -1;
}
</style>
</head>
<body>
<textarea id="hidden-input" rows="1" cols="1" autofocus></textarea>
<div id="terminal" tabindex="-1"></div>

<script>
(function() {
const terminal = document.getElementById('terminal');
const hiddenInput = document.getElementById('hidden-input');

const PROMPT = 'Script>';
const INPUT_PROMPT = 'input>';
const INPUT_CHOOSE_PROMPT = 'input-choose>';

function err(msg) { return '<span class="err-msg">error: ' + escapeHtml(String(msg)) + '</span>'; }
function hint(msg) { return '<span class="hint-msg">' + escapeHtml(String(msg)) + '</span>'; }
function ok(value) { return { ok: true, value: value }; }
function fail(message) { return { ok: false, error: message }; }

function varNameError(name) {
    if (typeof name !== 'string' || name === '') return 'variable name cannot be empty';
    if (!/^[A-Za-z_]/.test(name)) return 'invalid variable name "' + name + '": must start with a letter or underscore';
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) return 'invalid variable name "' + name + '": only letters, digits and underscores are allowed';
    return null;
}
function colorError(name) {
    if (!Object.prototype.hasOwnProperty.call(COLOR_MAP, name)) {
        return 'unknown color "' + name + '". Available colors: ' + Object.keys(COLOR_MAP).join(', ');
    }
    return null;
}
const COLOR_MAP = {
    'red': '#ff0000', 'light_red': '#ff6666', 'dark_red': '#990000',
    'green': '#00ff00', 'light_green': '#66ff66', 'dark_green': '#009900',
    'blue': '#0000ff', 'light_blue': '#6666ff', 'dark_blue': '#000099',
    'yellow': '#ffff00', 'light_yellow': '#ffff66', 'dark_yellow': '#999900',
    'cyan': '#00ffff', 'light_cyan': '#66ffff', 'dark_cyan': '#009999',
    'magenta': '#ff00ff', 'light_magenta': '#ff66ff', 'dark_magenta': '#990099',
    'orange': '#ffa500', 'light_orange': '#ffcc66', 'dark_orange': '#cc8400',
    'purple': '#800080', 'light_purple': '#cc66cc', 'dark_purple': '#4d004d'
};

const CS_HELP_TEXT = [
'=== CompactScript Command Syntax Reference ===',
'',
'[Variable Creation]',
'  text["name"]"value"           create text variable',
'  number["name"]"123"          create number variable',
'  text["name"]-color["color"]-"value"  create colored text variable',
'  number["name"]-color["color"]-"123"  create colored number variable',
'  Color/newline tokens: -n- -nr- -r- -color["c"]',
'',
'[Variable Access]',
'  text["name"]                  output text variable',
'  number["name"]                output number variable',
'',
'[Multi-Color Output]',
'  text-color["c1"]"s1"-color["c2"]"s2"     same line, two colors',
'  text-color["c1"]"s1"-n-color["c2"]"s2"   two lines, two colors',
'  number-color["c1"]"s1"-color["c2"]"s2"   single line only',
'',
'[Variable Type Conversion]',
'  variable-type["name"]-number  convert to number',
'  variable-type["name"]-text    convert to text',
'',
'[Variable Color]',
'  variable-color["name"]-color["color"]  set single color',
'',
'[Concatenation]',
'  text[concatenation]-"expr"    output concatenated text',
'  number[concatenation]-"expr"  output numeric string',
'',
'[List]',
'  Item names use "..." or ["varName"] (a variable value).',
'  list["n"]-"i1"(c1)-"i2"(c2)-...  create a list',
'  list["n"]                        create an empty list',
'  list["n"]"item"                  execute the item command',
'  list["n"]=["var"]                execute the item whose name is the var value',
'  list                             list all lists and items',
'  list-add["n"]-"item"(cmd)        add a literal item',
'  list-add["n"]-["var"](cmd)       add item named by the var value',
'  list-delete["n"]"item"           delete a literal item',
'  list-delete["n"]=["var"]         delete the item named by the var value',
'  list-delete["n"]=all             delete all items in the list',
'  list-delete =all                 delete all lists',
'  list-rename["old"]"new"          rename a list (both literal)',
'  list-rename["old"]=["var"]       new name is a variable value',
'  list-rename=["var"]"new"         old name is a variable value',
'  list-rename=["v1"]=["v2"]        both names are variable values',
'  list-replace["n"]"old"-"new"(cmd)        replace (both literal)',
'  list-replace["n"]-["v"]-"new"(cmd)       old name from a variable',
'  list-replace["n"]-"old"-["v"](cmd)       new name from a variable',
'  list-replace["n"]-["v1"]-["v2"]=(cmd)    both names from variables',
'    "(" or "=(" before the command both work.',
'',
'[Color System]',
'  red, light_red, dark_red, green, light_green, dark_green,',
'  blue, light_blue, dark_blue, yellow, light_yellow, dark_yellow,',
'  cyan, light_cyan, dark_cyan, magenta, light_magenta, dark_magenta,',
'  orange, light_orange, dark_orange, purple, light_purple, dark_purple',
'',
'[Variable Management]',
'  variable                      list all variables',
'  variable-delete "name"        delete a variable',
'  variable-delete =all          delete all variables',
'  variable-rename["old"]"new"   rename a variable',
'  variable-replace["name"]"new" replace content',
'',
'[Input]',
'  input["var"]-text"prompt"     prompt for text',
'  input["var"]-number"prompt"   prompt for number',
'  input["var"]-color["c"]-text"prompt"   set variable color',
'  input["var"]-text"p"-color["c"]        set prompt color',
'',
'  input-choose["var"]-text"prompt"-"opt"="val"...  choose (stores value)',
'  input-choose"prompt"-"opt"=(cmd)...              choose (executes command)',
'    Prompt color via -color["c"] after the prompt.',
'',
'  input-choose[long-press]-["var"]-type"prompt"-time["N"]"key"="value"...',
'      hold a key for N seconds to set the variable',
'  input-choose[long-press]"prompt"-time["N"]"key"=(cmd)...',
'      hold a key for N seconds to execute a command',
'    Prompt becomes "input-choose>[]" with the held key shown.',
'',
'[String]',
'  length"text"                 length of literal string',
'  length["varName"]            length of text variable',
'  length[list]-["name"]        number of items in a list',
'  length[list]-["name"]"item"  length of item command',
'  length[functional]-["name"]  number of commands in a function',
'  length[functional]-["name"]-N  length of N-th command (1-based)',
'',
'[Computation]',
'  computation "expr"           evaluate expression',
'    supports: + - * / ^ ** sqrt() ! and ["var"]',
'  computation[modulo]"12/5"    quotient and remainder',
'  computation[round]"7.2"      round to integer',
'  computation[variable]"expr"-["var"]   store result',
'  computation[variable-modulo]"a/b"-["var"]',
'  computation[variable-round]"expr"-["var"]',
'  Add -color["color"] at the end.',
'',
'[Conditional - if]',
'  Operands: ["varName"], -n"123", or -t"text".',
'  Condition: operand -op operand  with op = eq/ne/gt/lt/ge/le',
'    Numbers compare numerically, texts compare length.',
'  Format: if<cond>-true=(cmd)-false=(cmd)',
'    Use (null) for a branch to skip execution.',
'    Both branches cannot be (null).',
'',
'[While Loop]',
'  Same operand / condition syntax as if.',
'  Format: while<cond>-do(cmd1)-(cmd2)-...',
'    or: while<cond>-do=(cmd1)-(cmd2)-...',
'',
'[Function]',
'  functional                    list all functions',
'  functional["name"]-(cmd1)-(cmd2)-...  define a function',
'  functional["name"]              call the function',
'  functional-rename["old"]"new"   rename a function',
'  functional-delete "name"        delete a function',
'  functional-delete =all          delete all functions',
'  functional-replace["name"]-(cmd1)-(cmd2)-...  replace body',
'',
'[Save & Load]',
'  save"name"                    export .cscript (plain)',
'  save"name"-xor                export .cscript (XOR-encrypted)',
'  load                          open file picker',
'',
'[Plugin]',
'  plugin-load                   open a file picker and load a .csplugin',
'  plugin-uninstall              list loaded plugins',
'  plugin-uninstall "name"       unload the named plugin',
'  plugin-uninstall =all         unload all plugins',
'  plugin-help                   show the plugin authoring reference',
'',
'[System & Utility]',
'  clear, cs-help, help',
'  time"seconds"-command        schedule after delay',
'  time["varName"]-command      delay from number variable',
'  repeat"n"-command            repeat n times',
'  repeat["varName"]-command    repeat using variable',
'  random "a"-"b"-"c"           random pick from args',
'  random "1"-"10"              random integer range',
'  random(cmd1)-(cmd2)-...      randomly execute one command',
'  random"N"-(cmd1)-(cmd2)-...  randomly execute N commands',
'  random"N"-text"a"-"b"-"c"    randomly pick N texts',
'  random"N"-number"1"-"5"      randomly pick N unique integers',
'  random-number"1"-"10"        random integer in range',
'  random-text"1"-"10"          randomly pick one text',
'  random-uuid                  generate random UUID',
'  run(cmd1)-(cmd2)-...         execute multiple commands',
'',
'[Comments]',
'  #"..." at any position       comment content, removed before parsing',
'',
'All input is ASCII only, non-ASCII chars become ?',
'Shift+Enter inserts a newline; each line shows a prompt, newlines are removed on submit.'
].join('\n');

const PLUGIN_HELP_TEXT = [
'=== CompactScript Plugin (.csplugin) Reference ===',
'',
'A plugin is a pure-JSON file with the .csplugin extension.',
'Plugins NEVER execute JavaScript; only the host interpreter runs.',
'',
'[Top-level file format]',
'{',
'  "name": "my-plugin",',
'  "version": "1.0.0",',
'  "description": "short text",',
'  "commands": [ { ...command spec... }, ... ]',
'}',
'',
'[Command spec]',
'{',
'  "name": "cmd-name",           // /^[a-z][a-z0-9_-]*$/, must not conflict',
'  "help": "help text",',
'  "params": [ { "name":"n", "type":"number", "quoted": true } ],',
'  "continuations": [ { "type":"branch", "pattern":"-then\\\\s*\\\\(", "flags":"i" } ],',
'  "action": { "op":"...", ... },',
'  "returns": { "source": "slotName", "color": null }',
'}',
'',
'[params]',
'  name      identifier used by the "param" action',
'  type      text | number | color | var',
'  quoted    true  = value must be wrapped in "..."',
'            false = bare token allowed (no spaces)',
'  Params are parsed left-to-right, each may have an optional "-" prefix.',
'  number -> host number rule; color -> COLOR_MAP key; var -> variable name.',
'',
'[continuations]',
'  type     "flag"    consumes only its own matched text',
'           "branch"  consumes the following balanced (...) group',
'  pattern  a regular-expression SOURCE STRING',
'  flags    optional regex flags, e.g. "i"',
'  A "branch" pattern MUST end with "\\\\(" (literal open paren).',
'',
'[action tree - core]',
'  literal(value)                     -> literal string',
'  param(name)                        -> declared param value',
'  concat(args[])                     -> args concatenated',
'  add(a, b, out?)                    -> a + b',
'  sub(a, b, out?)                    -> a - b',
'  mul(a, b, out?)                    -> a * b',
'  div(a, b, out?)                    -> a / b',
'  double(in, out?)                   -> in * 2',
'  length(in, out?)                   -> string length',
'  upper(in, out?) / lower(in, out?)  -> case conversion',
'  getVar(name, out?)                 -> read host variable',
'  setVar(name, value, type?, color?, out?)',
'                                     -> create/update host variable',
'  color(color, text, out?)           -> <span> with COLOR_MAP color',
'  if(cond, then, else?, out?)        -> conditional',
'  emit(value)                        -> final output',
'',
'[action tree - logic]',
'  eq(a,b) ne(a,b) lt(a,b) gt(a,b) le(a,b) ge(a,b)',
'      compare numerically when both parse as numbers, else lexically',
'      result is "1" (true) or "0" (false)',
'  and(args[])   or(args[])   not(in)',
'  try(attempt, fallback, out?)       -> attempt; on error run fallback',
'  seq(args[], out?)                  -> run each, return last value',
'',
'[action tree - math]',
'  mod(a, b, out?)      a % b (error on /0)',
'  pow(a, b, out?)      a ** b',
'  abs(in, out?) floor(in, out?) ceil(in, out?) round(in, out?)',
'  min(args[], out?)    max(args[], out?)',
'  randomInt(min, max, out?)          -> integer in [min,max]',
'  randomUUID(out?)                   -> random UUID string',
'',
'[action tree - string]',
'  trim(in, out?)',
'  substr(in, start, end?, out?)',
'  replace(in, from, to, out?)        literal, replaces all',
'  split(in, sep, out?)               -> joined with newline',
'  indexOf(in, needle, out?)          -> integer, -1 when missing',
'  repeatStr(in, count, out?)         -> capped at 10000',
'',
'[action tree - lists]',
'  listAdd(list, key, value, out?)    create/update item',
'  listGet(list, key, out?)           read item (error if missing)',
'  listHas(list, key, out?)           "1"/"0"',
'  listDelete(list, key, out?)',
'  listKeys(list, out?)               joined with newline',
'  listCount(list, out?)',
'',
'[action tree - variables]',
'  getVarType(name, out?)             "text" | "number" | "" when missing',
'  delVar(name, out?)',
'',
'Any op may carry an "out": "slotName" field. Slots are local to one call.',
'',
'[returns]',
'  source   slot name to use as output (from any "out" field)',
'  color    optional COLOR_MAP color to wrap the final output',
'',
'[Built-in plugin commands]',
'  plugin-load             open a file picker and load a .csplugin',
'  plugin-uninstall        list loaded plugins',
'  plugin-uninstall "n"    unload plugin named n',
'  plugin-uninstall =all   unload every plugin',
'  plugin-help             show this reference',
'',
'[Example: math-extra.csplugin]',
'{',
'  "name": "math-extra",',
'  "version": "1.0.0",',
'  "description": "Double, shout, add2",',
'  "commands": [',
'    {',
'      "name": "double",',
'      "help": "double\\"5\\" -> 10",',
'      "params": [ { "name":"n", "type":"number", "quoted": true } ],',
'      "action": {',
'        "op": "double",',
'        "in": { "op": "param", "name": "n" },',
'        "out": "result"',
'      },',
'      "returns": { "source": "result", "color": "cyan" }',
'    },',
'    {',
'      "name": "shout",',
'      "help": "shout\\"hi\\" -> HI",',
'      "params": [ { "name":"t", "type":"text", "quoted": true } ],',
'      "action": {',
'        "op": "upper",',
'        "in": { "op": "param", "name": "t" },',
'        "out": "result"',
'      },',
'      "returns": { "source": "result" }',
'    },',
'    {',
'      "name": "add2",',
'      "help": "add2\\"1\\"\\"2\\" -> 3",',
'      "params": [',
'        { "name":"a", "type":"number", "quoted": true },',
'        { "name":"b", "type":"number", "quoted": true }',
'      ],',
'      "action": {',
'        "op": "add",',
'        "a": { "op": "param", "name": "a" },',
'        "b": { "op": "param", "name": "b" },',
'        "out": "result"',
'      },',
'      "returns": { "source": "result", "color": "green" }',
'    }',
'  ]',
'}',
'',
'[Safety]',
'  Plugins are data, not code. There is no eval, no Function, no timers,',
'  no DOM access and no dynamic import. Only the ops above are available.',
'  Command registration is atomic: if any command fails, all are rolled back.'
].join('\n');

let currentInput = '';
let outputLines = [];
let variables = {};
let functions = {};
let lists = {};
let pendingInput = null;

/* ============ Utility ============ */

function sanitizeAscii(str) {
    let result = '';
    for (const ch of str) {
        const code = ch.charCodeAt(0);
        if ((code >= 32 && code <= 126) || code === 10 || code === 13) {
            if (code === 13) result += '\n'; else result += ch;
        } else result += '?';
    }
    return result;
}
function stripComments(str) { return str.replace(/#"[^"]*"/g, ''); }
function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function htmlWithBr(str) { return escapeHtml(str).replace(/\n/g, '<br>'); }
function renderSegments(segments) {
    let html = '';
    for (const seg of segments) {
        if (seg.text === '\n') { html += '<br>'; continue; }
        const text = escapeHtml(seg.text).replace(/\n/g, '<br>');
        if (seg.color && COLOR_MAP[seg.color]) {
            html += '<span style="color: ' + COLOR_MAP[seg.color] + '">' + text + '</span>';
        } else html += text;
    }
    return html;
}
function renderVariable(v) {
    if (v.segments && v.segments.length > 0) return renderSegments(v.segments);
    let text;
    if (typeof v.value === 'string') text = v.value;
    else { text = formatNumber(v.value); if (text === null) text = String(v.value); }
    if (v.color && COLOR_MAP[v.color]) {
        return '<span style="color: ' + COLOR_MAP[v.color] + '">' + htmlWithBr(text) + '</span>';
    }
    return escapeHtml(text);
}
function render() {
    let html = '';
    outputLines.forEach(line => { html += line + '\n'; });
    let prompt;
    if (pendingInput) {
        if (pendingInput.kind === 'choose' || pendingInput.kind === 'choose-exec') prompt = INPUT_CHOOSE_PROMPT;
        else if (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec') {
            const key = pendingInput.pressedKey || '';
            prompt = INPUT_CHOOSE_PROMPT + '[' + escapeHtml(key) + ']';
        } else prompt = INPUT_PROMPT;
    } else prompt = PROMPT;
    const lines = currentInput.split('\n');
    lines.forEach((line, index) => {
        if (index === lines.length - 1) {
            html += prompt + escapeHtml(line) + '<span class="cursor-block"></span>';
        } else html += prompt + escapeHtml(line) + '\n';
    });
    terminal.innerHTML = html;
    terminal.scrollTop = terminal.scrollHeight;
}
function formatNumber(num) {
    if (typeof num !== 'number' || isNaN(num) || !isFinite(num)) return null;
    let str = num.toFixed(10);
    str = str.replace(/\.?0+$/, '');
    if (str === '-0') str = '0';
    return str;
}
function isValidNumber(str) {
    return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(String(str).trim());
}
function generateUUID() {
    if (window.crypto && window.crypto.getRandomValues) {
        const bytes = new Uint8Array(16);
        window.crypto.getRandomValues(bytes);
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;
        const hex = [];
        for (let i = 0; i < 16; i++) hex.push(bytes[i].toString(16).padStart(2, '0'));
        return [hex.slice(0,4).join(''),hex.slice(4,6).join(''),hex.slice(6,8).join(''),hex.slice(8,10).join(''),hex.slice(10,16).join('')].join('-');
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}
function factorial(n) {
    if (n < 0 || !Number.isInteger(n) || n > 170) return NaN;
    let result = 1;
    for (let i = 2; i <= n; i++) result *= i;
    return result;
}

/* ============ List name helpers ============ */

function matchItemName(str) {
    let m = str.match(/^\[\s*"([^"]+)"\s*\]/);
    if (m) return { type: 'var', name: m[1], length: m[0].length };
    m = str.match(/^"([^"]*)"/);
    if (m) return { type: 'lit', name: m[1], length: m[0].length };
    return null;
}
function resolveItemName(match, cmdPrefix) {
    if (match.type === 'lit') return { ok: true, name: match.name };
    const ne = varNameError(match.name);
    if (ne) return { ok: false, error: cmdPrefix + ': ' + ne };
    if (!variables[match.name]) return { ok: false, error: cmdPrefix + ': variable "' + match.name + '" not found' };
    const v = variables[match.name];
    let name;
    if (v.type === 'number') { const f = formatNumber(v.value); name = (f === null) ? String(v.value) : f; }
    else name = String(v.value);
    return { ok: true, name: name };
}
function parseNameExpr(str) {
    let m = str.match(/^=\s*\[\s*"([^"]*)"\s*\]/);
    if (m) return { type: 'var', name: m[1], length: m[0].length };
    m = str.match(/^\[\s*"([^"]*)"\s*\]/);
    if (m) return { type: 'lit', name: m[1], length: m[0].length };
    m = str.match(/^"([^"]*)"/);
    if (m) return { type: 'lit', name: m[1], length: m[0].length };
    return null;
}
function resolveNameExpr(res, cmdPrefix) {
    if (res.type === 'lit') return { ok: true, name: res.name };
    const ne = varNameError(res.name);
    if (ne) return { ok: false, error: cmdPrefix + ': ' + ne };
    if (!variables[res.name]) return { ok: false, error: cmdPrefix + ': variable "' + res.name + '" not found' };
    const v = variables[res.name];
    let name;
    if (v.type === 'number') { const f = formatNumber(v.value); name = (f === null) ? String(v.value) : f; }
    else name = String(v.value);
    return { ok: true, name: name };
}

/* ============ Condition helpers ============ */

function parseOperandAt(str) {
    let m = str.match(/^-\s*n\s*"([^"]*)"/i);
    if (m) return { kind: 'num', value: m[1], length: m[0].length };
    m = str.match(/^-\s*t\s*"([^"]*)"/i);
    if (m) return { kind: 'text', value: m[1], length: m[0].length };

const IGNORED_KEYS = new Set([
    'Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab',
    'Escape', 'Enter', 'Backspace', 'Delete', 'Insert',
    'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',

    'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'

}
function handleLongPressDown(key) {
    const p = pendingInput;
    if (!p || (p.kind !== 'long-press' && p.kind !== 'long-press-exec')) return;
    if (p.pressedKey !== null) return;
    if (IGNORED_KEYS.has(key)) return;
    if (key.length !== 1) return;
    p.pressedKey = key; p.timers = [];
    render();
    if (!Object.prototype.hasOwnProperty.call(p.keyMap, key)) {
        outputLines.push('<span class="hint-msg">That option does not exist. Please enter a valid option.</span>');
        render(); return;
    }
    const entries = p.keyMap[key];
    p.timers = entries.map(e => setTimeout(() => {
        if (pendingInput !== p) return;
        if (p.pressedKey !== key) return;
        if (p.kind === 'long-press') {
            if (p.type === 'text') variables[p.varName] = { type: 'text', value: e.value };
            else {
                const num = parseFloat(e.value);
                variables[p.varName] = { type: 'number', value: isNaN(num) ? 0 : num };
            }
            if (p.color) variables[p.varName].color = p.color;
        } else if (p.kind === 'long-press-exec') {
            const output = processCommand(e.cmd, true);
            if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
        }
        p.triggered = true;
        render();
    }, e.time * 1000));
}
function handleLongPressUp(key) {
    const p = pendingInput;
    if (!p || (p.kind !== 'long-press' && p.kind !== 'long-press-exec')) return;
    if (p.pressedKey !== key) return;
    if (p.timers && p.timers.length) for (const t of p.timers) clearTimeout(t);
    p.timers = [];

}

/* ============ extractSubCommands ============ */

function extractSubCommands(str) {
    const subcommands = [];
    let i = 0;
    const len = str.length;
    while (i < len) {
        while (i < len && (str[i] === ' ' || str[i] === '\t' || str[i] === '-')) i++;
        if (i >= len) break;
        if (str[i] !== '(') return [];
        let depth = 0, inString = false, start = i;
        for (; i < len; i++) {
            const ch = str[i];
            if (inString) { if (ch === '"') inString = false; continue; }
            if (ch === '"') { inString = true; continue; }
            if (ch === '(') depth++;
            else if (ch === ')') {
                depth--;
                if (depth === 0) { subcommands.push(str.substring(start + 1, i).trim()); i++; break; }
            }
        }
        if (depth !== 0) return [];
        const lastContent = subcommands[subcommands.length - 1];
        const cmdName = getLeadingCommandName(lastContent);
        const conts = (cmdName && COMMAND_CONTINUATIONS[cmdName]) || [];
        if (conts.length === 0) continue;
        while (i < len) {
            while (i < len && (str[i] === ' ' || str[i] === '\t')) i++;
            if (i >= len) break;
            if (str[i] !== '-') break;
            const cont = str.slice(i);
            let matched = false;
            for (const rule of conts) {
                const m = cont.match(rule.pattern);
                if (!m) continue;
                if (rule.type === 'branch') {
                    const p = extractParenthesized(cont, m[0].length - 1);
                    if (!p) return [];
                    const segment = cont.substring(0, m[0].length - 1) + '(' + p.content + ')';
                    subcommands[subcommands.length - 1] += segment;
                    i += segment.length; matched = true; break;
                } else {
                    subcommands[subcommands.length - 1] += cont.substring(0, m[0].length);
                    i += m[0].length; matched = true; break;
                }
            }
            if (!matched) break;
        }
    }
    return subcommands;
}

                if (key.length !== 1) return err('input-choose[long-press]: key must be a single character');
                if (!Number.isInteger(timeSec) || timeSec <= 0) return err('input-choose[long-press]: time must be a positive integer');
                entries.push({ key, time: timeSec, value });
                remaining = remaining.substring(tm[0].length);
            }
            if (entries.length === 0) return err('input-choose[long-press]: no time entries specified');
            if (type === 'number') {
                for (const e of entries) if (!isValidNumber(e.value)) return err('input-choose[long-press]: value "' + e.value + '" is not a valid number');
            }
            const keyMap = {};
            for (const e of entries) {
                if (!Object.prototype.hasOwnProperty.call(keyMap, e.key)) keyMap[e.key] = [];
                keyMap[e.key].push({ time: e.time, value: e.value });
            }
            for (const k in keyMap) keyMap[k].sort((a, b) => a.time - b.time);
            pendingInput = { kind: 'long-press', varName, type, color: varColor, keyMap, pressedKey: null, timers: [], triggered: false };
            if (promptSegments.length > 0) outputLines.push(renderSegments(promptSegments));
            render();
            return '';
        }
        const r = parseLongPressExecFormat(remaining);
        if (!r.ok) return err('input-choose[long-press]: ' + r.error);
        const promptSegments = promptTokensToSegments(r.value.promptTokens);
        const entries = r.value.entries;
        const keyMap = {};
        for (const e of entries) {
            if (!Object.prototype.hasOwnProperty.call(keyMap, e.key)) keyMap[e.key] = [];
            keyMap[e.key].push({ time: e.time, cmd: e.cmd });
        }
        for (const k in keyMap) keyMap[k].sort((a, b) => a.time - b.time);
        pendingInput = { kind: 'long-press-exec', keyMap, pressedKey: null, timers: [], triggered: false };
        if (promptSegments.length > 0) outputLines.push(renderSegments(promptSegments));
        render();
        return '';
    }
    if (!rest.startsWith('[')) {
        const r = parseChooseExecFormat(rest);
        if (!r.ok) return err('input-choose: ' + r.error);
        const promptSegments = promptTokensToSegments(r.value.promptTokens);
        pendingInput = { kind: 'choose-exec', options: r.value.options };
        if (promptSegments.length > 0) outputLines.push(renderSegments(promptSegments));
        render();
        return '';
    }
    const headerMatch = rest.match(/^\[\s*"([^"]+)"\s*\]([\s\S]*)$/);
    if (!headerMatch) return err('input-choose: bad syntax');
    const varName = headerMatch[1];
    let remaining = headerMatch[2].trim();
    const nameErr = varNameError(varName);
    if (nameErr) return err('input-choose: ' + nameErr);
    if (variables[varName]) return err('input-choose: variable "' + varName + '" already exists');
    let varColor = null;
    const colorFirstMatch = remaining.match(/^-color\s*\[\s*"([^"]+)"\s*\]\s*/i);
    if (colorFirstMatch) {
        varColor = colorFirstMatch[1];
        const ce = colorError(varColor);
        if (ce) return err('input-choose: ' + ce);
        remaining = remaining.substring(colorFirstMatch[0].length).trim();
    }
    const typeMatch = remaining.match(/^-?\s*(text|number)\s*/i);
    if (!typeMatch) return err('input-choose: missing type (text or number)');
    const type = typeMatch[1].toLowerCase();
    remaining = remaining.substring(typeMatch[0].length);
    const optStart = remaining.search(/-"[^"]+"\s*=\s*"/);
    let promptExpr = '', optionsExpr = '';
    if (optStart >= 0) { promptExpr = remaining.slice(0, optStart).trim(); optionsExpr = remaining.slice(optStart); }
    else promptExpr = remaining.trim();
    let promptSegments = [];
    if (promptExpr !== '') {
        const pr = parseMultiColorValue(promptExpr, varColor, true);
        if (!pr.ok) return err('input-choose: ' + pr.error);
        promptSegments = pr.value;
    }
    const options = {};
    let oi = 0;
    while (oi < optionsExpr.length) {
        while (oi < optionsExpr.length && /\s/.test(optionsExpr[oi])) oi++;
        if (oi >= optionsExpr.length) break;
        if (optionsExpr[oi] !== '-') return err('input-choose: expected "-" before option');
        oi++;
        while (oi < optionsExpr.length && /\s/.test(optionsExpr[oi])) oi++;
        if (oi >= optionsExpr.length || optionsExpr[oi] !== '"') return err('input-choose: expected option name in quotes');
        let j = oi + 1;
        while (j < optionsExpr.length && optionsExpr[j] !== '"') j++;
        if (j >= optionsExpr.length) return err('input-choose: unterminated option name');
        const optName = optionsExpr.slice(oi + 1, j);
        oi = j + 1;
        while (oi < optionsExpr.length && /\s/.test(optionsExpr[oi])) oi++;
        if (oi >= optionsExpr.length || optionsExpr[oi] !== '=') return err('input-choose: expected "=" after option "' + optName + '"');
        oi++;
        while (oi < optionsExpr.length && /\s/.test(optionsExpr[oi])) oi++;
        if (oi >= optionsExpr.length || optionsExpr[oi] !== '"') return err('input-choose: expected value in quotes');
        j = oi + 1;
        while (j < optionsExpr.length && optionsExpr[j] !== '"') j++;
        if (j >= optionsExpr.length) return err('input-choose: unterminated option value');
        const optValue = optionsExpr.slice(oi + 1, j);
        oi = j + 1;
        if (options.hasOwnProperty(optName)) return err('input-choose: duplicate option "' + optName + '"');
        options[optName] = optValue;
    }
    if (Object.keys(options).length === 0) return err('input-choose: no options specified');
    if (type === 'number') {
        for (const optName in options) if (!isValidNumber(options[optName])) return err('input-choose: option "' + optName + '" value "' + options[optName] + '" is not a valid number');
    }
    pendingInput = { kind: 'choose', varName, type, color: varColor, options };
    if (promptSegments.length > 0) outputLines.push(renderSegments(promptSegments));
    render();
    return '';
}, CONT_INPUT_CHOOSE);

defineCommand('text', function(rest) {
    const concatMatch = rest.match(/^\[\s*concatenation\s*\]\s*-?\s*"([\s\S]*)"\s*$/i);
    if (concatMatch) {
        const result = evaluateComputation(concatMatch[1]);
        if (!result.ok) return err('text[concatenation]: ' + result.error);
        return escapeHtml(result.value);
    }
    const varMatch = rest.match(/^\[\s*"([^"]+)"\s*\]([\s\S]*)$/);
    if (varMatch) {
        const varName = varMatch[1];
        const afterName = varMatch[2].trim();
        const nameErr = varNameError(varName);
        if (nameErr) return err('text: ' + nameErr);
        if (afterName === '') {
            if (!variables[varName]) return err('text: variable "' + varName + '" not found');
            if (variables[varName].type !== 'text') return err('text: variable is not text type');
            return renderVariable(variables[varName]);
        }
        if (variables[varName]) return err('text: variable "' + varName + '" already exists.');
        const pr = parseMultiColorValue(afterName, null, true);
        if (!pr.ok) return err('text: ' + pr.error);
        const bv = buildVariable('text', pr.value, true);
        if (!bv.ok) return err('text: ' + bv.error);
        variables[varName] = bv.value;
        return '';
    }
    if (rest.startsWith('"')) {
        const pr = parseMultiColorValue(rest, null, true);
        if (!pr.ok) return err('text: ' + pr.error);
        return renderSegments(pr.value);
    }
    return err('text: bad syntax');
}, CONT_COLOR_CHAIN);

defineCommand('number', function(rest) {

    if (concatMatch) {
        const result = evaluatePureConcatenation(concatMatch[1]);
        if (!result.ok) return err('number[concatenation]: ' + result.error);

        return escapeHtml(formatNumber(parseFloat(result.value)));

    const varMatch = rest.match(/^\[\s*"([^"]+)"\s*\]([\s\S]*)$/);

defineCommand('computation', function(rest) {
    let mainRest = rest, colorName = null;
    const cs = rest.match(/^(.*?)\s*-\s*color\s*\[\s*"([^"]+)"\s*\]\s*$/i);
    if (cs) {
        mainRest = cs[1].trim(); colorName = cs[2];
        const ce = colorError(colorName);
        if (ce) return err('computation: ' + ce);
    }
    const KNOWN_MODES = ['modulo', 'round', 'variable', 'variable-modulo', 'variable-round'];
    const modeMatch = mainRest.match(/^\[\s*([^\]]+)\s*\]\s*"([^"]*)"(?:\s*-\s*\[\s*"([^"]+)"\s*\])?\s*$/i);
    if (modeMatch) {
        const mode = modeMatch[1].trim().toLowerCase();
        const expr = modeMatch[2];
        const varName = modeMatch[3] || null;
        if (KNOWN_MODES.indexOf(mode) === -1) return err('computation: unknown mode');
        if (mode === 'modulo') {
            const r = evaluateModulo(expr);
            if (!r.ok) return err('computation: ' + r.error);
            return colorName ? '<span style="color: ' + COLOR_MAP[colorName] + '">' + escapeHtml(r.value) + '</span>' : r.value;
        }
        if (mode === 'round') {
            const r = evaluateRound(expr);
            if (!r.ok) return err('computation: ' + r.error);
            return colorName ? '<span style="color: ' + COLOR_MAP[colorName] + '">' + escapeHtml(r.value) + '</span>' : r.value;
        }
        if (mode === 'variable' || mode === 'variable-modulo' || mode === 'variable-round') {
            if (!varName) return err('computation: missing target variable');
            const ne = varNameError(varName);
            if (ne) return err('computation: ' + ne);
            let result;
            if (mode === 'variable') result = evaluateComputation(expr);
            else if (mode === 'variable-modulo') result = evaluateModulo(expr);
            else result = evaluateRound(expr);
            if (!result.ok) return err('computation: ' + result.error);
            if (mode === 'variable' && !isValidNumber(result.value)) variables[varName] = { type: 'text', value: result.value };
            else variables[varName] = { type: 'number', value: parseFloat(result.value) };
            if (colorName) variables[varName].color = colorName;
            return '';
        }
    }
    if (!mainRest.startsWith('"')) return err('computation: expression must be in quotes');
    const exprMatch = mainRest.match(/^"([^"]*)"\s*$/);
    if (!exprMatch) return err('computation: bad syntax');
    const result = evaluateComputation(exprMatch[1]);
    if (!result.ok) return err('computation: ' + result.error);
    return colorName ? '<span style="color: ' + COLOR_MAP[colorName] + '">' + escapeHtml(result.value) + '</span>' : escapeHtml(result.value);
});

defineCommand('time', function(rest, ctx) {
    let delay = null, innerCommand = null;
    const vtm = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-\s*(.*)$/i);
    if (vtm) {

        if (nameErr) return err('time: ' + nameErr);
        if (!variables[vtm[1]]) return err('time: variable "' + vtm[1] + '" not found');
        if (variables[vtm[1]].type !== 'number') return err('time: variable is not number');

    } else {
        const lm = rest.match(/^"(\d+)"\s*-\s*(.*)$/i);
        if (lm) { delay = parseInt(lm[1], 10); innerCommand = lm[2].trim(); }
    }
    if (delay === null) return err('time: Usage: time"seconds"-command');
    if (innerCommand === '') return err('time: missing command');
    setTimeout(() => {

        const output = processCommand(innerCommand, true);

});
defineCommand('run', function(rest) {

defineCommand('while', function(rest) {

    const doMatch = rem.match(/^-?\s*do\s*=?\s*/i);
