<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompactScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            font-family: "Courier New", "Lucida Console", "Monaco", monospace;
        }

        #terminal {
            width: 100%;
            height: 100%;
            background: #000000;
            color: #ffffff;
            padding: 16px 20px;
            font-size: 18px;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
            caret-color: #ffffff;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #terminal::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .cursor-block {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #ffffff;
            vertical-align: text-bottom;
            margin-left: 1px;
            animation: blink 1s step-end infinite;
            -webkit-animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @-webkit-keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .err-msg { color: #ff5555; }
        .hint-msg { color: #888888; }

        #hidden-input {
            position: fixed;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            width: 1px;
            height: 1px;
            background: transparent;
            border: none;
            outline: none;
            color: transparent;
            caret-color: transparent;
            font-size: 1px;
            padding: 0;
            margin: 0;
            z-index: -1;
        }
    </style>
</head>
<body>
    <textarea id="hidden-input" rows="1" cols="1" autofocus></textarea>

    <div id="terminal" tabindex="-1"></div>

    <script>
        (function() {
            const terminal = document.getElementById('terminal');
            const hiddenInput = document.getElementById('hidden-input');

            const PROMPT = 'Script>';
            const INPUT_PROMPT = 'input>';
            const INPUT_CHOOSE_PROMPT = 'input-choose>';

            function err(msg) {
                return '<span class="err-msg">error: ' + escapeHtml(String(msg)) + '</span>';
            }

            function hint(msg) {
                return '<span class="hint-msg">' + escapeHtml(String(msg)) + '</span>';
            }

            function ok(value) { return { ok: true, value: value }; }
            function fail(message) { return { ok: false, error: message }; }

            function varNameError(name) {
                if (typeof name !== 'string' || name === '') {
                    return 'variable name cannot be empty';
                }
                if (!/^[A-Za-z_]/.test(name)) {
                    return 'invalid variable name "' + name + '": must start with a letter or underscore';
                }
                if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
                    return 'invalid variable name "' + name + '": only letters, digits and underscores are allowed';
                }
                return null;
            }

            function colorError(name) {
                if (!Object.prototype.hasOwnProperty.call(COLOR_MAP, name)) {
                    return 'unknown color "' + name + '". Available colors: ' +
                        Object.keys(COLOR_MAP).join(', ');
                }
                return null;
            }

            const COLOR_MAP = {
                'red': '#ff0000',
                'light_red': '#ff6666',
                'dark_red': '#990000',
                'green': '#00ff00',
                'light_green': '#66ff66',
                'dark_green': '#009900',
                'blue': '#0000ff',
                'light_blue': '#6666ff',
                'dark_blue': '#000099',
                'yellow': '#ffff00',
                'light_yellow': '#ffff66',
                'dark_yellow': '#999900',
                'cyan': '#00ffff',
                'light_cyan': '#66ffff',
                'dark_cyan': '#009999',
                'magenta': '#ff00ff',
                'light_magenta': '#ff66ff',
                'dark_magenta': '#990099',
                'orange': '#ffa500',
                'light_orange': '#ffcc66',
                'dark_orange': '#cc8400',
                'purple': '#800080',
                'light_purple': '#cc66cc',
                'dark_purple': '#4d004d'
            };

            const CS_HELP_TEXT = [
                '=== CompactScript Command Syntax Reference ===',
                '',
                '[Variable Creation]',
                '  text["name"]"value"           create text variable',
                '  number["name"]"123"          create number variable',
                '  text["name"]-color["color"]-"value"  create colored text variable',
                '  number["name"]-color["color"]-"123"  create colored number variable',
                '',
                '  Multiple colors in one variable (text only can use -n-):',
                '    text["v"]-color["red"]"a"-color["green"]"b"      single line, two colors',
                '    text["v"]-color["red"]"a"-n-"b"                  two lines, both red',
                '    text["v"]-color["red"]"a"-n-color["blue"]"b"     two lines, red then blue',
                '    text["v"]-color["red"]"a"-nr-"b"                 two lines, red then default',
                '    text["v"]-color["red"]"a"-r-"b"                  single line, red then default',
                '    number["v"]-color["red"]"12"-color["yellow"]"34" single line, two colors',
                '',
                '  Color and newline control tokens between strings:',
                '    -n-      newline, keep current color',
                '    -nr-     newline, reset color to default (white)',
                '    -r-      no newline, reset color to default (white)',
                '    -color["c"]  change current color (no newline)',
                '',
                '[Variable Access]',
                '  text["name"]                  output text variable (with colors if set)',
                '  number["name"]                output number variable (with colors if set)',
                '',
                '[Multi-Color Output]',
                '  text-color["c1"]"s1"-color["c2"]"s2"     same line, two colors',
                '  text-color["c1"]"s1"-n-color["c2"]"s2"   two lines, two colors',
                '  text-color["c1"]"s1"-n-"s2"              two lines, both c1',
                '  text-color["c1"]"s1"-nr-"s2"             two lines, c1 then default',
                '  text-color["c1"]"s1"-r-"s2"              same line, c1 then default',
                '  number-color["c1"]"s1"-color["c2"]"s2"   number can only be single line',
                '',
                '[Variable Type Conversion]',
                '  variable-type["name"]-number  convert a text variable to a number variable',
                '  variable-type["name"]-text    convert a number variable to a text variable',
                '',
                '[Variable Color]',
                '  variable-color["name"]-color["color"]  set single color for a variable',
                '',
                '[Concatenation]',
                '  text[concatenation]-"expr"    output concatenated text, expr can contain ["varName"]',
                '  number[concatenation]-"expr"  output numeric string built by ["varName"] references',
                '',
                '[List]',
                '  list["name"]-item1(cmd1)-item2(cmd2)-...  create a list',
                '  list["name"]                  create an empty list',
                '  list["name"]"item"            execute the command stored in item',
                '  list                          list all lists and their items',
                '  list-add["name"]-item(cmd)    add a new item to an existing list',
                '  list-delete["name"]"item"     delete an item from a list',
                '  list-delete["name"]=all       delete all items inside a list',
                '  list-delete =all              delete all lists',
                '  list-rename["old"]"new"       rename a list',
                '  list-replace["name"]-oldItem-newItem(newCmd)  replace an item',
                '    The old item name is enough; no need to match its old command.',
                '    Example: list-replace["ghg"]-1-2(text"dsds")',
                '',
                '[Color System]',
                '  Available colors (24 total):',
                '    red, light_red, dark_red, green, light_green, dark_green,',
                '    blue, light_blue, dark_blue, yellow, light_yellow, dark_yellow,',
                '    cyan, light_cyan, dark_cyan, magenta, light_magenta, dark_magenta,',
                '    orange, light_orange, dark_orange, purple, light_purple, dark_purple',
                '',
                '[Variable Management]',
                '  variable                      list all variables',
                '  variable-delete "name"        delete specific variable',
                '  variable-delete =all          delete all variables',
                '  variable-rename["old"]"new"   rename variable',
                '  variable-replace["name"]"new" replace variable content (supports -n-)',
                '',
                '[Input]',
                '  input["var"]-text"prompt"    prompt for text input',
                '  input["var"]-number"prompt"  prompt for number input',
                '  input["var"]-color["c"]-text"prompt"    set variable color',
                '  input["var"]-text"p1"-color["c"]"p2"    multi-color prompt (same line)',
                '  input["var"]-text"p1"-n-color["c"]"p2"  multi-color prompt (two lines)',
                '  input["var"]-text"p1"-nr-"p2"           two lines, reset color between',
                '  input["var"]-text"p1"-r-"p2"            same line, reset color between',
                '    Prompt first segment uses the variable color (if set) as its default.',
                '    The stored input variable itself is single-colored.',
                '',
                '  input-choose["var"]-text"prompt"-"opt1"="val1"-"opt2"="val2"...  choose from options (stores value)',
                '  input-choose["var"]-number"prompt"-"opt1"="1"-"opt2"="2"...      numeric choices (stores value)',
                '  input-choose["var"]-color["c"]-number"prompt"-"a"="1"-"b"="2"    variable color',
                '    Prompt supports multi-color, -n-, -nr- and -r- just like input.',
                '    Prompt becomes "input-choose>" and only listed option names are accepted.',
                '    Valid option sets the variable to the corresponding value.',
                '    Invalid option shows: That option does not exist. Please enter a valid option.',
                '',
                '  input-choose"prompt"-"opt1"=(cmd1)-"opt2"=(cmd2)...  execute a command by typing an option',
                '    No variable is stored; the matched command is executed directly.',
                '    Example: input-choose"sss"-"ggg"=(text"fdf")-"gggf"=(number"444")',
                '    Prompt color via -color["c"] after the prompt, e.g.',
                '      input-choose"sss"-color["light_blue"]-"ggg"=(text"fdf")',
                '    Invalid option shows the same grey message as above.',
                '',
                '  input-choose[long-press]-["var"]-type"prompt"-time["N"]"key"="value"...  hold a key to store value',
                '    Press and hold a single key for N seconds to set the variable.',
                '    The prompt becomes "input-choose>[]" and the currently held key appears in [].',
                '    Multiple entries with the same key are allowed as long as their times differ.',
                '',
                '  input-choose[long-press]"prompt"-time["N"]"key"=(cmd)...  hold a key to execute a command',
                '    No variable is stored; the matched command is executed directly.',
                '    Example:',
                '      input-choose[long-press]"ddd"-time["5"]"s"=(number"777")-time["15"]"h"=(number"111")',
                '    Prompt color via -color["c"] after the prompt, e.g.',
                '      input-choose[long-press]"ddd"-color["red"]-time["5"]"s"=(number"777")',
                '    Invalid key shows the same grey message as input-choose.',
                '',
                '[String]',
                '  length"text"                 length of literal string',
                '  length["varName"]            length of text variable',
                '  length[list]-["name"]        number of items in a list',
                '  length[list]-["name"]"item"  length of the command stored in an item',
                '  length[functional]-["name"]  number of commands in a function',
                '  length[functional]-["name"]-N  length of the N-th command (1-based)',
                '',
                '[Computation]',
                '  computation "expr"           evaluate expression',
                '    supports: + - * / ^ ** sqrt() ! and ["var"]',
                '  computation[modulo]"12/5"    remainder division',
                '  computation[round]"7.2"      round to integer',
                '  computation[variable]"1+1"-["lkl"]  store result',
                '  computation[variable-modulo]"12/5"-["var"]  store quotient and remainder',
                '  computation[variable-round]"7.2"-["var"]  store rounded result',
                '  Add -color["color"] at the end for colored output.',
                '',
                '[Conditional]',
                '  if["var1"]-op-["var2"]-true=(cmd)-false=(cmd)',
                '    op: -eq -ne -gt -lt -ge -le',
                '',
                '[While Loop]',
                '  while["var1"]-op-["var2"]-do(cmd1)-(cmd2)-...',
                '',
                '[Function]',
                '  functional                    list all functions',
                '  functional["name"]-(cmd1)-(cmd2)-...  define a function',
                '  functional["name"]              call the function',
                '  functional-rename["old"]"new"   rename a function',
                '  functional-delete "name"        delete specific function',
                '  functional-delete =all          delete all functions',
                '  functional-replace["name"]-(cmd1)-(cmd2)-...  replace function body',
                '',
                '[Save & Load]',
                '  save"name"                    export a .cscrip file (plain text, default)',
                '  save"name"-xor                export a .cscrip file with XOR-encrypted payload',
                '    Files are exported to your downloads folder.',
                '  load                          open file picker to load a .cscrip file',
                '    Encrypted and plain .cscrip files are both supported; the loader auto-detects.',
                '    If the file is corrupted or the extension does not match, a red error is shown.',
                '',
                '[System & Utility]',
                '  clear, cs-help, help',
                '  time"seconds"-command        schedule command after delay',
                '  time["varName"]-command      delay from number variable',
                '  repeat"n"-command            repeat n times',
                '  repeat["varName"]-command    repeat using variable',
                '  random "a"-"b"-"c"           random pick from args',
                '  random "1"-"10"              random integer range',
                '  random(cmd1)-(cmd2)-...      randomly execute one command',
                '  random"N"-(cmd1)-(cmd2)-...  randomly execute N commands',
                '  random"N"-text"a"-"b"-"c"    randomly pick N texts',
                '  random"N"-number"1"-"5"      randomly pick N unique integers',
                '  random-number"1"-"10"        random integer in range',
                '  random-text"1"-"10"          randomly pick one text',
                '  random-uuid                  generate random UUID',
                '  run(cmd1)-(cmd2)-...         execute multiple commands',
                '',
                '[Comments]',
                '  ; or # at line start         comment line ignored',
                '',
                'All input is ASCII only, non-ASCII chars become ?',
                'Shift+Enter inserts a newline; each line shows a prompt, newlines are removed on submit.'
            ].join('\n');

            const COMMAND_HELP = CS_HELP_TEXT;

            let currentInput = '';
            let outputLines = [];
            let variables = {};
            let functions = {};
            let lists = {};
            let pendingInput = null;

            /* ============ Utility ============ */

            function sanitizeAscii(str) {
                let result = '';
                for (const ch of str) {
                    const code = ch.charCodeAt(0);
                    if ((code >= 32 && code <= 126) || code === 10 || code === 13) {
                        if (code === 13) result += '\n';
                        else result += ch;
                    } else result += '?';
                }
                return result;
            }

            function escapeHtml(str) {
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function htmlWithBr(str) {
                return escapeHtml(str).replace(/\n/g, '<br>');
            }

            function renderSegments(segments) {
                let html = '';
                for (const seg of segments) {
                    if (seg.text === '\n') { html += '<br>'; continue; }
                    const text = escapeHtml(seg.text).replace(/\n/g, '<br>');
                    if (seg.color && COLOR_MAP[seg.color]) {
                        html += '<span style="color: ' + COLOR_MAP[seg.color] + '">' + text + '</span>';
                    } else {
                        html += text;
                    }
                }
                return html;
            }

            function renderVariable(v) {
                if (v.segments && v.segments.length > 0) return renderSegments(v.segments);
                let text;
                if (typeof v.value === 'string') text = v.value;
                else {
                    text = formatNumber(v.value);
                    if (text === null) text = String(v.value);
                }
                if (v.color && COLOR_MAP[v.color]) {
                    return '<span style="color: ' + COLOR_MAP[v.color] + '">' + htmlWithBr(text) + '</span>';
                }
                return escapeHtml(text);
            }

            function render() {
                let html = '';
                outputLines.forEach(line => { html += line + '\n'; });
                let prompt;
                if (pendingInput) {
                    if (pendingInput.kind === 'choose' || pendingInput.kind === 'choose-exec') {
                        prompt = INPUT_CHOOSE_PROMPT;
                    } else if (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec') {
                        const key = pendingInput.pressedKey || '';
                        prompt = INPUT_CHOOSE_PROMPT + '[' + escapeHtml(key) + ']';
                    } else {
                        prompt = INPUT_PROMPT;
                    }
                } else {
                    prompt = PROMPT;
                }
                const lines = currentInput.split('\n');
                lines.forEach((line, index) => {
                    if (index === lines.length - 1) {
                        html += prompt + escapeHtml(line);
                        html += '<span class="cursor-block"></span>';
                    } else html += prompt + escapeHtml(line) + '\n';
                });
                terminal.innerHTML = html;
                terminal.scrollTop = terminal.scrollHeight;
            }

            function formatNumber(num) {
                if (typeof num !== 'number' || isNaN(num) || !isFinite(num)) return null;
                let str = num.toFixed(10);
                str = str.replace(/\.?0+$/, '');
                if (str === '-0') str = '0';
                return str;
            }

            function isValidNumber(str) {
                return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(String(str).trim());
            }

            function generateUUID() {
                if (window.crypto && window.crypto.getRandomValues) {
                    const bytes = new Uint8Array(16);
                    window.crypto.getRandomValues(bytes);
                    bytes[6] = (bytes[6] & 0x0f) | 0x40;
                    bytes[8] = (bytes[8] & 0x3f) | 0x80;
                    const hex = [];
                    for (let i = 0; i < 16; i++) hex.push(bytes[i].toString(16).padStart(2, '0'));
                    return [
                        hex.slice(0, 4).join(''), hex.slice(4, 6).join(''),
                        hex.slice(6, 8).join(''), hex.slice(8, 10).join(''),
                        hex.slice(10, 16).join('')
                    ].join('-');
                } else {
                    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        const r = Math.random() * 16 | 0;
                        const v = c === 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                }
            }

            function factorial(n) {
                if (n < 0 || !Number.isInteger(n) || n > 170) return NaN;
                let result = 1;
                for (let i = 2; i <= n; i++) result *= i;
                return result;
            }

            /* ============ Save / Load (file-based, .cscrip only with optional XOR) ============ */

            const CS_MAGIC_TEXT = 'CSCRIPT-CSCRIP-V1\n';
            const CS_MAGIC_XOR = 'CSCRIPT-CSCRIP-XOR-V1\n';
            const FILE_EXT = '.cscrip';

            const XOR_KEY = new Uint8Array([
                0x5A, 0x37, 0xC1, 0x9E, 0x42, 0x88, 0x1D, 0xF6,
                0x33, 0x7B, 0xA4, 0xE0, 0x5C, 0x91, 0x2F, 0xD8
            ]);

            function xorBytes(bytes) {
                const out = new Uint8Array(bytes.length);
                for (let i = 0; i < bytes.length; i++) {
                    out[i] = bytes[i] ^ XOR_KEY[i % XOR_KEY.length];
                }
                return out;
            }

            function saveToFile(name, encrypted) {
                const data = { variables, functions, lists };
                let json;
                try { json = JSON.stringify(data); }
                catch (e) { return err('save: could not serialize data (' + e.message + ')'); }

                let blob;
                try {
                    if (encrypted) {
                        const headerBytes = new TextEncoder().encode(CS_MAGIC_XOR);
                        const jsonBytes = new TextEncoder().encode(json);
                        const xored = xorBytes(jsonBytes);
                        const bytes = new Uint8Array(headerBytes.length + xored.length);
                        bytes.set(headerBytes, 0);
                        bytes.set(xored, headerBytes.length);
                        blob = new Blob([bytes], { type: 'application/octet-stream' });
                    } else {
                        const text = CS_MAGIC_TEXT + json;
                        blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                    }
                } catch (e) {
                    return err('save: could not build file (' + e.message + ')');
                }

                try {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = name + FILE_EXT;
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 2000);
                } catch (e) {
                    return err('save: download failed (' + e.message + ')');
                }

                return hint('Saved as ' + name + FILE_EXT + (encrypted ? ' (XOR-encrypted)' : ''));
            }

            function openLoadDialog() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.cscrip,text/plain,application/octet-stream';
                input.style.display = 'none';
                document.body.appendChild(input);

                let handled = false;

                input.addEventListener('change', async function(e) {
                    if (handled) return;
                    handled = true;
                    const file = e.target.files && e.target.files[0];
                    if (document.body.contains(input)) document.body.removeChild(input);
                    if (!file) {
                        setTimeout(() => hiddenInput.focus(), 0);
                        return;
                    }
                    try { await loadFromFile(file); }
                    catch (ex) {
                        outputLines.push(err('load: unexpected error (' + ex.message + ')'));
                        render();
                    }
                    setTimeout(() => hiddenInput.focus(), 0);
                });

                input.addEventListener('cancel', function() {
                    if (handled) return;
                    handled = true;
                    if (document.body.contains(input)) document.body.removeChild(input);
                    setTimeout(() => hiddenInput.focus(), 0);
                });

                try { input.click(); }
                catch (e) {
                    if (document.body.contains(input)) document.body.removeChild(input);
                    outputLines.push(err('load: could not open file picker (' + e.message + ')'));
                    render();
                }
            }

            async function loadFromFile(file) {
                const name = file.name || '(unnamed)';
                const lowerName = name.toLowerCase();

                if (!lowerName.endsWith(FILE_EXT)) {
                    outputLines.push(err('load: unsupported file extension "' + name +
                        '". Only ' + FILE_EXT + ' files are allowed.'));
                    render();
                    return;
                }

                let bytes;
                try {
                    const buffer = await file.arrayBuffer();
                    bytes = new Uint8Array(buffer);
                } catch (e) {
                    outputLines.push(err('load: failed to read file "' + name + '" (' + e.message + ')'));
                    render();
                    return;
                }

                if (bytes.length === 0) {
                    outputLines.push(err('load: file "' + name + '" is empty or corrupted.'));
                    render();
                    return;
                }

                const xorHeaderBytes = new TextEncoder().encode(CS_MAGIC_XOR);
                const plainHeaderBytes = new TextEncoder().encode(CS_MAGIC_TEXT);

                let isXor = false;
                if (bytes.length >= xorHeaderBytes.length) {
                    let match = true;
                    for (let i = 0; i < xorHeaderBytes.length; i++) {
                        if (bytes[i] !== xorHeaderBytes[i]) { match = false; break; }
                    }
                    if (match) isXor = true;
                }

                let jsonText;
                if (isXor) {
                    const payload = bytes.slice(xorHeaderBytes.length);
                    const decoded = xorBytes(payload);
                    try { jsonText = new TextDecoder('utf-8', { fatal: true }).decode(decoded); }
                    catch (e) {
                        outputLines.push(err('load: ' + FILE_EXT + ' file "' + name +
                            '" is corrupted (invalid XOR-encoded data).'));
                        render();
                        return;
                    }
                } else {
                    if (bytes.length < plainHeaderBytes.length) {
                        outputLines.push(err('load: ' + FILE_EXT + ' file "' + name + '" is too short or corrupted.'));
                        render();
                        return;
                    }
                    for (let i = 0; i < plainHeaderBytes.length; i++) {
                        if (bytes[i] !== plainHeaderBytes[i]) {
                            outputLines.push(err('load: file content does not match ' + FILE_EXT + ' format. ' +
                                'The file may be corrupted or have an incorrect extension.'));
                            render();
                            return;
                        }
                    }
                    let text;
                    try { text = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
                    catch (e) {
                        outputLines.push(err('load: ' + FILE_EXT + ' file "' + name +
                            '" is corrupted (invalid text encoding).'));
                        render();
                        return;
                    }
                    jsonText = text.substring(CS_MAGIC_TEXT.length);
                }

                let parsed;
                try { parsed = JSON.parse(jsonText); }
                catch (e) {
                    outputLines.push(err('load: ' + FILE_EXT + ' file "' + name + '" is corrupted and cannot be parsed.'));
                    render();
                    return;
                }
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
                    outputLines.push(err('load: ' + FILE_EXT + ' file "' + name + '" is corrupted (invalid data structure).'));
                    render();
                    return;
                }
                applyLoadedData(parsed);
                outputLines.push(hint('Loaded successfully from ' + name +
                    (isXor ? ' (XOR-encrypted)' : '')));
                render();
            }

            function applyLoadedData(parsed) {
                if (parsed && typeof parsed === 'object' && parsed.variables !== undefined) {
                    variables = parsed.variables || {};
                    functions = parsed.functions || {};
                    lists = parsed.lists || {};
                } else {
                    variables = parsed || {};
                    functions = {};
                    lists = {};
                }
            }

            /* ============ Multi-color value parsing ============ */

            function tokenizeValueExpr(str) {
                const tokens = [];
                let i = 0;
                while (i < str.length) {
                    while (i < str.length && /\s/.test(str[i])) i++;
                    if (i >= str.length) break;

                    if (str[i] === '"') {
                        let j = i + 1;
                        while (j < str.length && str[j] !== '"') j++;
                        if (j >= str.length) return fail('unterminated string literal');
                        tokens.push({ type: 'string', value: str.slice(i + 1, j) });
                        i = j + 1;
                        continue;
                    }

                    if (str[i] === '-') {
                        i++;
                        while (i < str.length && /\s/.test(str[i])) i++;

                        if (i < str.length && str[i].toLowerCase() === 'n') {
                            let saveN = i;
                            i++;
                            while (i < str.length && /\s/.test(str[i])) i++;

                            if (i < str.length && str[i].toLowerCase() === 'r') {
                                let saveR = i;
                                i++;
                                while (i < str.length && /\s/.test(str[i])) i++;
                                if (i < str.length && str[i] === '-') {
                                    i++;
                                    tokens.push({ type: 'newline-reset' });
                                    while (i < str.length && /\s/.test(str[i])) i++;
                                    const colorAfter = str.slice(i).match(/^color\s*\[\s*"([^"]+)"\s*\]/i);
                                    if (colorAfter) {
                                        tokens.push({ type: 'color', value: colorAfter[1] });
                                        i += colorAfter[0].length;
                                    }
                                    continue;
                                }
                                i = saveR;
                            }

                            if (i < str.length && str[i] === '-') {
                                i++;
                                tokens.push({ type: 'newline' });
                                while (i < str.length && /\s/.test(str[i])) i++;
                                const colorAfterN = str.slice(i).match(/^color\s*\[\s*"([^"]+)"\s*\]/i);
                                if (colorAfterN) {
                                    tokens.push({ type: 'color', value: colorAfterN[1] });
                                    i += colorAfterN[0].length;
                                }
                                continue;
                            }
                            i = saveN;
                        }

                        if (i < str.length && str[i].toLowerCase() === 'r') {
                            let saveR = i;
                            i++;
                            while (i < str.length && /\s/.test(str[i])) i++;
                            if (i < str.length && str[i] === '-') {
                                i++;
                                tokens.push({ type: 'reset' });
                                while (i < str.length && /\s/.test(str[i])) i++;
                                const colorAfter = str.slice(i).match(/^color\s*\[\s*"([^"]+)"\s*\]/i);
                                if (colorAfter) {
                                    tokens.push({ type: 'color', value: colorAfter[1] });
                                    i += colorAfter[0].length;
                                }
                                continue;
                            }
                            i = saveR;
                        }

                        const colorMatch = str.slice(i).match(/^color\s*\[\s*"([^"]+)"\s*\]/i);
                        if (colorMatch) {
                            tokens.push({ type: 'color', value: colorMatch[1] });
                            i += colorMatch[0].length;
                            continue;
                        }

                        tokens.push({ type: 'dash' });
                        continue;
                    }

                    return fail('unexpected character "' + str[i] + '"');
                }
                return ok(tokens);
            }

            function parseMultiColorValue(str, initialColor, allowNewlines) {
                const tr = tokenizeValueExpr(str);
                if (!tr.ok) return tr;
                const tokens = tr.value;
                if (tokens.length === 0) return fail('empty value expression');

                const segments = [];
                let currentColor = initialColor;
                let trailingColor = null;

                for (const tok of tokens) {
                    if (tok.type === 'string') {
                        if (!allowNewlines && tok.value.includes('\n')) {
                            return fail('newlines are not allowed in this expression');
                        }
                        segments.push({ color: currentColor, text: tok.value });
                        trailingColor = null;
                    } else if (tok.type === 'newline') {
                        if (!allowNewlines) return fail('newlines are not allowed in this expression');
                        segments.push({ color: null, text: '\n' });
                        trailingColor = null;
                    } else if (tok.type === 'newline-reset') {
                        if (!allowNewlines) return fail('newlines are not allowed in this expression');
                        segments.push({ color: null, text: '\n' });
                        currentColor = null;
                        trailingColor = null;
                    } else if (tok.type === 'reset') {
                        currentColor = null;
                        trailingColor = null;
                    } else if (tok.type === 'color') {
                        const ce = colorError(tok.value);
                        if (ce) return fail(ce);
                        currentColor = tok.value;
                        trailingColor = tok.value;
                    }
                }

                if (segments.length === 0) return fail('empty value expression');

                if (trailingColor !== null) {
                    for (let k = segments.length - 1; k >= 0; k--) {
                        if (segments[k].text !== '\n') {
                            segments[k].color = trailingColor;
                            break;
                        }
                    }
                }

                return ok(segments);
            }

            // Convert a list of {type, value} prompt tokens into segments.
            function promptTokensToSegments(tokens) {
                const segments = [];
                let currentColor = null;
                let trailingColor = null;
                for (const tok of tokens) {
                    if (tok.type === 'string') {
                        segments.push({ color: currentColor, text: tok.value });
                        trailingColor = null;
                    } else if (tok.type === 'color') {
                        currentColor = tok.value;
                        trailingColor = tok.value;
                    } else if (tok.type === 'newline') {
                        segments.push({ color: null, text: '\n' });
                        trailingColor = null;
                    } else if (tok.type === 'newline-reset') {
                        segments.push({ color: null, text: '\n' });
                        currentColor = null;
                        trailingColor = null;
                    } else if (tok.type === 'reset') {
                        currentColor = null;
                        trailingColor = null;
                    }
                }
                if (trailingColor !== null) {
                    for (let k = segments.length - 1; k >= 0; k--) {
                        if (segments[k].text !== '\n') {
                            segments[k].color = trailingColor;
                            break;
                        }
                    }
                }
                return segments;
            }

            function buildVariable(type, segments, allowNewlines) {
                if (!segments || segments.length === 0) return fail('empty value');
                let hasColor = false, hasNewline = false;
                const colors = new Set();
                for (const seg of segments) {
                    if (seg.text === '\n') hasNewline = true;
                    if (seg.color) { hasColor = true; colors.add(seg.color); }
                }
                if (!allowNewlines && hasNewline) return fail('newlines are not allowed in this expression');
                const fullText = segments.map(s => s.text).join('');

                if (type === 'number') {
                    if (!isValidNumber(fullText)) return fail('"' + fullText + '" is not a valid number');
                    const v = { type: 'number', value: parseFloat(fullText) };
                    if (hasColor || hasNewline) {
                        v.segments = segments;
                        if (colors.size === 1 && !hasNewline) v.color = [...colors][0];
                    }
                    return ok(v);
                } else {
                    const v = { type: 'text', value: fullText };
                    if (hasColor || hasNewline) {
                        v.segments = segments;
                        if (colors.size === 1) v.color = [...colors][0];
                    }
                    return ok(v);
                }
            }

            function extractSubCommands(str) {
                const subcommands = [];
                let i = 0;
                const len = str.length;
                while (i < len) {
                    while (i < len && (str[i] === ' ' || str[i] === '\t' || str[i] === '-')) i++;
                    if (i >= len) break;
                    if (str[i] !== '(') return [];
                    let depth = 0, inString = false, start = i;
                    for (; i < len; i++) {
                        const ch = str[i];
                        if (inString) {
                            if (ch === '"') inString = false;
                            continue;
                        }
                        if (ch === '"') { inString = true; continue; }
                        if (ch === '(') depth++;
                        else if (ch === ')') {
                            depth--;
                            if (depth === 0) {
                                subcommands.push(str.substring(start + 1, i).trim());
                                i++;
                                break;
                            }
                        }
                    }
                    if (depth !== 0) return [];
                }
                return subcommands;
            }

            function extractParenthesized(str, startPos) {
                let i = startPos;
                while (i < str.length && (str[i] === ' ' || str[i] === '\t')) i++;
                if (i >= str.length || str[i] !== '(') return null;
                let depth = 0, inString = false, start = i;
                for (; i < str.length; i++) {
                    const ch = str[i];
                    if (inString) {
                        if (ch === '"') inString = false;
                        continue;
                    }
                    if (ch === '"') { inString = true; continue; }
                    if (ch === '(') depth++;
                    else if (ch === ')') {
                        depth--;
                        if (depth === 0) {
                            return { content: str.substring(start + 1, i).trim(), endPos: i + 1 };
                        }
                    }
                }
                return null;
            }

            function parseValueWithNewlines(str) {
                const r = parseMultiColorValue(str, null, true);
                if (!r.ok) return r;
                const full = r.value.map(s => s.text).join('');
                return ok(full);
            }

            /* ============ Exec-mode format parsers ============ */

            // Parses: "prompt"-color["c"]-"opt1"=(cmd1)-"opt2"=(cmd2)...
            function parseChooseExecFormat(str) {
                const promptTokens = [];
                const options = [];
                let i = 0;
                let scanningPrompt = true;

                while (i < str.length) {
                    while (i < str.length && /\s/.test(str[i])) i++;
                    if (i >= str.length) break;

                    if (str[i] === '"') {
                        let j = i + 1;
                        while (j < str.length && str[j] !== '"') j++;
                        if (j >= str.length) return fail('unterminated string');
                        const content = str.slice(i + 1, j);

                        let k = j + 1;
                        while (k < str.length && /\s/.test(str[k])) k++;
                        if (k < str.length && str[k] === '=' && scanningPrompt) {
                            // option entry
                            k++;
                            while (k < str.length && /\s/.test(str[k])) k++;
                            if (k >= str.length || str[k] !== '(') {
                                return fail('expected "(" after "=" for option "' + content + '"');
                            }
                            const paren = extractParenthesized(str, k);
                            if (!paren) return fail('missing ")" in option command');
                            options.push({ name: content, cmd: paren.content });
                            i = paren.endPos;
                            scanningPrompt = false;
                            continue;
                        }
                        if (scanningPrompt) {
                            promptTokens.push({ type: 'string', value: content });
                        }
                        i = j + 1;
                        continue;
                    }

                    if (str[i] === '-') {
                        i++;
                        while (i < str.length && /\s/.test(str[i])) i++;

                        const colorMatch = str.slice(i).match(/^color\s*\[\s*"([^"]+)"\s*\]/i);
                        if (colorMatch) {
                            const ce = colorError(colorMatch[1]);
                            if (ce) return fail(ce);
                            if (scanningPrompt) promptTokens.push({ type: 'color', value: colorMatch[1] });
                            i += colorMatch[0].length;
                            continue;
                        }
                        const nrMatch = str.slice(i).match(/^nr-/i);
                        if (nrMatch) {
                            if (scanningPrompt) promptTokens.push({ type: 'newline-reset' });
                            i += nrMatch[0].length;
                            continue;
                        }
                        const nMatch = str.slice(i).match(/^n-/i);
                        if (nMatch) {
                            if (scanningPrompt) promptTokens.push({ type: 'newline' });
                            i += nMatch[0].length;
                            continue;
                        }
                        const rMatch = str.slice(i).match(/^r-/i);
                        if (rMatch) {
                            if (scanningPrompt) promptTokens.push({ type: 'reset' });
                            i += rMatch[0].length;
                            continue;
                        }
                        // plain dash
                        continue;
                    }

                    return fail('unexpected character "' + str[i] + '"');
                }

                if (options.length === 0) return fail('no options specified');
                return ok({ promptTokens, options });
            }

            // Parses: "prompt"-color["c"]-time["N"]"key"=(cmd)-time["N"]"key"=(cmd)...
            function parseLongPressExecFormat(str) {
                const promptTokens = [];
                const entries = [];
                let i = 0;
                let scanningPrompt = true;

                while (i < str.length) {
                    while (i < str.length && /\s/.test(str[i])) i++;
                    if (i >= str.length) break;

                    if (str[i] === '-') {
                        i++;
                        while (i < str.length && /\s/.test(str[i])) i++;

                        const timeMatch = str.slice(i).match(/^time\s*\[\s*"(\d+)"\s*\]\s*/i);
                        if (timeMatch) {
                            const timeSec = parseInt(timeMatch[1], 10);
                            i += timeMatch[0].length;

                            if (i >= str.length || str[i] !== '"') {
                                return fail('expected key in quotes after time[...]');
                            }
                            let j = i + 1;
                            while (j < str.length && str[j] !== '"') j++;
                            if (j >= str.length) return fail('unterminated key');
                            const key = str.slice(i + 1, j);
                            i = j + 1;
                            if (key.length !== 1) {
                                return fail('key must be a single character, got "' + key + '"');
                            }

                            while (i < str.length && /\s/.test(str[i])) i++;
                            if (i >= str.length || str[i] !== '=') {
                                return fail('expected "=" after key "' + key + '"');
                            }
                            i++;
                            while (i < str.length && /\s/.test(str[i])) i++;
                            if (i >= str.length || str[i] !== '(') {
                                return fail('expected "(" after "=" for key "' + key + '"');
                            }
                            const paren = extractParenthesized(str, i);
                            if (!paren) return fail('missing ")" in command');
                            entries.push({ key, time: timeSec, cmd: paren.content });
                            i = paren.endPos;
                            scanningPrompt = false;
                            continue;
                        }

                        const colorMatch = str.slice(i).match(/^color\s*\[\s*"([^"]+)"\s*\]/i);
                        if (colorMatch) {
                            const ce = colorError(colorMatch[1]);
                            if (ce) return fail(ce);
                            if (scanningPrompt) promptTokens.push({ type: 'color', value: colorMatch[1] });
                            i += colorMatch[0].length;
                            continue;
                        }
                        const nrMatch = str.slice(i).match(/^nr-/i);
                        if (nrMatch) {
                            if (scanningPrompt) promptTokens.push({ type: 'newline-reset' });
                            i += nrMatch[0].length;
                            continue;
                        }
                        const nMatch = str.slice(i).match(/^n-/i);
                        if (nMatch) {
                            if (scanningPrompt) promptTokens.push({ type: 'newline' });
                            i += nMatch[0].length;
                            continue;
                        }
                        const rMatch = str.slice(i).match(/^r-/i);
                        if (rMatch) {
                            if (scanningPrompt) promptTokens.push({ type: 'reset' });
                            i += rMatch[0].length;
                            continue;
                        }
                        continue;
                    }

                    if (str[i] === '"') {
                        let j = i + 1;
                        while (j < str.length && str[j] !== '"') j++;
                        if (j >= str.length) return fail('unterminated string');
                        const content = str.slice(i + 1, j);
                        if (scanningPrompt) {
                            promptTokens.push({ type: 'string', value: content });
                        }
                        i = j + 1;
                        continue;
                    }

                    return fail('unexpected character "' + str[i] + '"');
                }

                if (entries.length === 0) return fail('no time entries specified');
                return ok({ promptTokens, entries });
            }

            function evaluatePureConcatenation(expr) {
                const trimmed = expr.trim();
                if (trimmed === '') return fail('empty expression');
                const varRegex = /\[\s*"([A-Za-z_][A-Za-z0-9_]*)"\s*\]/g;
                let refMatch;
                const anyVarRef = /\[\s*"([^"]*)"\s*\]/g;
                while ((refMatch = anyVarRef.exec(trimmed)) !== null) {
                    const nameErr = varNameError(refMatch[1]);
                    if (nameErr) return fail('invalid variable reference ' + refMatch[0] + ': ' + nameErr);
                }
                let m;
                varRegex.lastIndex = 0;
                while ((m = varRegex.exec(trimmed)) !== null) {
                    if (!Object.prototype.hasOwnProperty.call(variables, m[1])) {
                        return fail('variable "' + m[1] + '" not found');
                    }
                }
                varRegex.lastIndex = 0;
                const stripped = trimmed.replace(varRegex, '');
                if (/[-*/^!]/.test(stripped)) {
                    return fail('number[concatenation] only supports "+" concatenation and ["varName"] substitution');
                }
                const parts = trimmed.includes('+') ? trimmed.split('+') : [trimmed];
                let resultStr = '';
                for (let part of parts) {
                    part = part.trim();
                    if (part === '') continue;
                    resultStr += part.replace(varRegex, (_, name) => String(variables[name].value));
                }
                return ok(resultStr);
            }

            function evaluateModulo(expr) {
                const parts = expr.split('/');
                if (parts.length !== 2) return fail('modulo expects one "/", e.g. "12/5"');
                const left = parts[0].trim(), right = parts[1].trim();
                if (left === '' || right === '') return fail('modulo: both sides must be non-empty');
                const lr = evaluateComputation(left); if (!lr.ok) return lr;
                const rr = evaluateComputation(right); if (!rr.ok) return rr;
                const a = parseFloat(lr.value), b = parseFloat(rr.value);
                if (isNaN(a)) return fail('modulo: left operand is not a number');
                if (isNaN(b)) return fail('modulo: right operand is not a number');
                if (b === 0) return fail('modulo: division by zero');
                const q = Math.floor(a / b);
                return ok(q + '......' + (a - q * b));
            }

            function evaluateRound(expr) {
                const r = evaluateComputation(expr);
                if (!r.ok) return r;
                const num = parseFloat(r.value);
                if (isNaN(num)) return fail('round: did not produce a number');
                return ok(String(Math.round(num)));
            }

            function evaluateComputation(expr) {
                const trimmed = expr.trim();
                if (trimmed === '') return fail('empty expression');
                const varRegex = /\[\s*"([A-Za-z_][A-Za-z0-9_]*)"\s*\]/g;
                let refMatch;
                const anyVarRef = /\[\s*"([^"]*)"\s*\]/g;
                while ((refMatch = anyVarRef.exec(trimmed)) !== null) {
                    const nameErr = varNameError(refMatch[1]);
                    if (nameErr) return fail('invalid variable reference ' + refMatch[0] + ': ' + nameErr);
                }
                let hasTextVar = false, hasNumberVar = false;
                const matches = [...trimmed.matchAll(varRegex)];
                for (const match of matches) {
                    const name = match[1];
                    if (!Object.prototype.hasOwnProperty.call(variables, name)) return fail('variable "' + name + '" not found');
                    if (variables[name].type === 'text') hasTextVar = true;
                    else hasNumberVar = true;
                }
                if (hasTextVar && hasNumberVar) return fail('cannot mix text and number variables');
                const stripped = trimmed.replace(varRegex, '');
                const hasLettersOutsideVars = /[A-Za-z]/.test(stripped.replace(/sqrt/gi, ''));

                if (hasTextVar || hasLettersOutsideVars) {
                    if (/[-*/^!]/.test(stripped)) return fail('text expressions only support "+" concatenation');
                    const parts = trimmed.includes('+') ? trimmed.split('+') : [trimmed];
                    let resultStr = '';
                    for (let part of parts) {
                        part = part.trim();
                        if (part === '') continue;
                        const pureVarMatch = part.match(/^\[\s*"([A-Za-z_][A-Za-z0-9_]*)"\s*\]$/);
                        if (pureVarMatch) {
                            const name = pureVarMatch[1];
                            if (variables[name].type !== 'text') return fail('variable "' + name + '" is not text');
                            resultStr += variables[name].value;
                        } else {
                            let hasError = false, errorMsg = '';
                            const replacedPart = part.replace(varRegex, (m, name) => {
                                if (!variables[name]) { hasError = true; errorMsg = 'variable "' + name + '" not found'; return m; }
                                if (variables[name].type !== 'text') { hasError = true; errorMsg = 'variable "' + name + '" is not text'; return m; }
                                return variables[name].value;
                            });
                            if (hasError) return fail(errorMsg);
                            resultStr += replacedPart;
                        }
                    }
                    return ok(resultStr);
                }

                let evalExpr = trimmed;
                evalExpr = evalExpr.replace(/sqrt\(/gi, 'Math.sqrt(');
                evalExpr = evalExpr.replace(varRegex, (m, name) => {
                    if (!variables[name] || variables[name].type !== 'number') return 'NaN';
                    return variables[name].value;
                });
                if (/\.\d+!/.test(evalExpr)) return fail('factorial "!" requires an integer');
                evalExpr = evalExpr.replace(/(\d+)!/g, 'factorial($1)');
                evalExpr = evalExpr.replace(/\^/g, '**');
                const lettersCheck = evalExpr.replace(/Math\.sqrt/g, '').replace(/factorial/g, '');
                if (/[A-Za-z]/.test(lettersCheck)) {
                    const bad = lettersCheck.match(/[A-Za-z]+/)[0];
                    return fail('unknown identifier "' + bad + '"');
                }
                if (/[&|<>?:]/.test(evalExpr)) return fail('unsupported operator');
                if (/[[\]]/.test(evalExpr)) return fail('invalid variable reference');
                try {
                    const fn = new Function('factorial', '"use strict"; return (' + evalExpr + ')');
                    const result = fn(factorial);
                    if (typeof result !== 'number') return fail('expression did not evaluate to a number');
                    if (Number.isNaN(result)) return fail('expression evaluated to NaN');
                    if (!isFinite(result)) return fail('expression evaluated to Infinity');
                    return ok(formatNumber(result));
                } catch (e) { return fail('cannot evaluate expression: ' + e.message); }
            }

            function executeSequentialCommands(subcommands) {
                let index = 0;
                function executeNext() {
                    if (index >= subcommands.length) { render(); return; }
                    const cmd = subcommands[index];
                    const timeMatch = cmd.match(/^time\s*(?:"(\d+)"|\[\s*"([^"]+)"\s*\])\s*-\s*(.*)$/i);
                    if (timeMatch) {
                        let delay; let okDelay = true;
                        if (timeMatch[1]) delay = parseInt(timeMatch[1], 10);
                        else {
                            const varName = timeMatch[2];
                            if (!variables[varName]) { outputLines.push(err('time: variable "' + varName + '" not found')); okDelay = false; }
                            else if (variables[varName].type !== 'number') { outputLines.push(err('time: variable is not number')); okDelay = false; }
                            else { delay = variables[varName].value;
                                if (!Number.isInteger(delay) || delay < 0) { outputLines.push(err('time: delay must be non-negative integer')); okDelay = false; } }
                        }
                        const innerCmd = timeMatch[3].trim();
                        if (okDelay && innerCmd === '') { outputLines.push(err('time: missing command')); okDelay = false; }
                        if (!okDelay) { index++; executeNext(); return; }
                        setTimeout(() => {
                            const output = processCommand(innerCmd, true);
                            if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
                            index++;
                            executeNext();
                        }, delay * 1000);
                    } else {
                        const output = processCommand(cmd, true);
                        if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
                        index++;
                        executeNext();
                    }
                }
                executeNext();
            }

            /* ============ Long-press helpers ============ */

            const IGNORED_KEYS = new Set([
                'Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab',
                'Escape', 'Enter', 'Backspace', 'Delete', 'Insert',
                'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
                'Home', 'End', 'PageUp', 'PageDown',
                'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'
            ]);

            function finishLongPress() {
                if (pendingInput && (pendingInput.kind === 'long-press' || pendingInput.kind === 'long-press-exec')) {
                    if (pendingInput.timers && pendingInput.timers.length) {
                        for (const t of pendingInput.timers) clearTimeout(t);
                    }
                    pendingInput = null;
                    currentInput = '';
                    hiddenInput.value = '';
                    render();
                }
            }

            function handleLongPressDown(key) {
                const p = pendingInput;
                if (!p || (p.kind !== 'long-press' && p.kind !== 'long-press-exec')) return;
                if (p.pressedKey !== null) return;
                if (IGNORED_KEYS.has(key)) return;
                if (key.length !== 1) return;

                p.pressedKey = key;
                p.timers = [];
                render();

                if (!Object.prototype.hasOwnProperty.call(p.keyMap, key)) {
                    outputLines.push('<span class="hint-msg">That option does not exist. Please enter a valid option.</span>');
                    render();
                    return;
                }

                const entries = p.keyMap[key];
                p.timers = entries.map(e => setTimeout(() => {
                    if (pendingInput !== p) return;
                    if (p.pressedKey !== key) return;
                    if (p.kind === 'long-press') {
                        if (p.type === 'text') {
                            variables[p.varName] = { type: 'text', value: e.value };
                        } else {
                            const num = parseFloat(e.value);
                            variables[p.varName] = { type: 'number', value: isNaN(num) ? 0 : num };
                        }
                        if (p.color) variables[p.varName].color = p.color;
                    } else if (p.kind === 'long-press-exec') {
                        const output = processCommand(e.cmd, true);
                        if (output !== '') output.split('\n').forEach(line => outputLines.push(line));
                    }
                    p.triggered = true;
                    render();
                }, e.time * 1000));
            }

            function handleLongPressUp(key) {
                const p = pendingInput;
                if (!p || (p.kind !== 'long-press' && p.kind !== 'long-press-exec')) return;
                if (p.pressedKey !== key) return;

                if (p.timers && p.timers.length) {
                    for (const t of p.timers) clearTimeout(t);
                }
                p.timers = [];
                const wasTriggered = !!p.triggered;
                p.pressedKey = null;
                p.triggered = false;

                if (wasTriggered) {
                    finishLongPress();
                } else {
                    render();
                }
            }

            /* ============ Main command processor ============ */

            function processCommand(input, skipDisplayCommand = false) {
                input = sanitizeAscii(input.trim());
                if (input === '') return '';

                const cmdMatch = input.match(/^(text-color|number-color|text|number|computation|clear|variable-color|variable-type|variable-delete|variable-rename|variable-replace|variable|cs-help|time|random-number|random-text|random|repeat|help|if|length|input-choose|input|run|while|save|load|functional-rename|functional-delete|functional-replace|functional|list-add|list-delete|list-rename|list-replace|list)\s*(.*)$/i);
                if (!cmdMatch) {
                    const word = input.split(/\s+/)[0];
                    return err('unknown command "' + word + '". Type "help" or "cs-help" for commands.');
                }
                const command = cmdMatch[1].toLowerCase();
                const rest = cmdMatch[2].trim();

                if (command === 'clear') { outputLines = []; render(); return ''; }
                if (command === 'cs-help' || command === 'help') return CS_HELP_TEXT;

                /* --------- random-number / random-text --------- */
                if (command === 'random-number') {
                    const match = rest.match(/^"(-?\d+)"\s*-\s*"(-?\d+)"\s*$/);
                    if (!match) return err('random-number: Usage: random-number"min"-"max"');
                    const min = parseInt(match[1], 10), max = parseInt(match[2], 10);
                    if (min > max) return err('random-number: lower > upper');
                    return String(Math.floor(Math.random() * (max - min + 1)) + min);
                }
                if (command === 'random-text') {
                    const params = [];
                    const ms = rest.match(/"([^"]*)"/g);
                    if (ms) for (const m of ms) params.push(m.slice(1, -1));
                    if (params.length < 2) return err('random-text: need at least 2 quoted args');
                    return params[Math.floor(Math.random() * params.length)];
                }

                /* --------- variable-color --------- */
                if (command === 'variable-color') {
                    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-\s*color\s*\[\s*"([^"]+)"\s*\]\s*$/i);
                    if (!match) return err('variable-color: Usage: variable-color["name"]-color["colorName"]');
                    const nameErr = varNameError(match[1]);
                    if (nameErr) return err('variable-color: ' + nameErr);
                    const ce = colorError(match[2]);
                    if (ce) return err('variable-color: ' + ce);
                    if (!variables[match[1]]) return err('variable-color: variable "' + match[1] + '" not found');
                    variables[match[1]].color = match[2];
                    delete variables[match[1]].segments;
                    return '';
                }

                /* --------- variable-type --------- */
                if (command === 'variable-type') {
                    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*-\s*(text|number)\s*$/i);
                    if (!match) return err('variable-type: Usage: variable-type["name"]-text|number');
                    const nameErr = varNameError(match[1]);
                    if (nameErr) return err('variable-type: ' + nameErr);
                    if (!variables[match[1]]) return err('variable-type: variable "' + match[1] + '" not found');
                    const v = variables[match[1]];
                    const targetType = match[2].toLowerCase();
                    if (v.type === targetType) return '';
                    if (targetType === 'number') {
                        const strVal = String(v.value).trim();
                        if (!isValidNumber(strVal)) return err('variable-type: cannot convert to number');
                        const newVar = { type: 'number', value: parseFloat(strVal) };
                        if (v.color) newVar.color = v.color;
                        if (v.segments) newVar.segments = v.segments;
                        variables[match[1]] = newVar;
                    } else {
                        let formatted;
                        if (typeof v.value === 'string') formatted = v.value;
                        else { formatted = formatNumber(v.value); if (formatted === null) return err('variable-type: invalid number'); }
                        const newVar = { type: 'text', value: formatted };
                        if (v.color) newVar.color = v.color;
                        if (v.segments) newVar.segments = v.segments;
                        variables[match[1]] = newVar;
                    }
                    return '';
                }

                /* --------- variable --------- */
                if (command === 'variable') {
                    if (rest !== '') return err('variable: takes no arguments');
                    if (Object.keys(variables).length === 0) return hint('(no variables defined)');
                    let result = '';
                    for (const name in variables) {
                        const v = variables[name];
                        const colorInfo = v.color ? '  [color: ' + v.color + ']' : '';
                        result += v.type + ': ' + name + ' = ' + v.value + colorInfo + '\n';
                    }
                    return result.replace(/\n$/, '');
                }

                /* --------- variable-delete --------- */
                if (command === 'variable-delete') {
                    let param = rest.trim();
                    if (param === '') return err('variable-delete: Usage: variable-delete "name" or =all');
                    if (param.toLowerCase() === '=all') { variables = {}; return ''; }
                    if (param.startsWith('=')) param = param.substring(1).trim();
                    if (param.startsWith('"') && param.endsWith('"')) param = param.slice(1, -1);
                    const nameErr = varNameError(param);
                    if (nameErr) return err('variable-delete: ' + nameErr);
                    if (!variables[param]) return err('variable-delete: variable "' + param + '" not found');
                    delete variables[param];
                    return '';
                }

                /* --------- variable-rename --------- */
                if (command === 'variable-rename') {
                    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*"([^"]*)"\s*$/);
                    if (!match) return err('variable-rename: Usage: variable-rename["old"]"new"');
                    const nameErr1 = varNameError(match[1]);
                    if (nameErr1) return err('variable-rename: ' + nameErr1);
                    const nameErr2 = varNameError(match[2]);
                    if (nameErr2) return err('variable-rename: ' + nameErr2);
                    if (!variables[match[1]]) return err('variable-rename: variable "' + match[1] + '" not found');
                    if (variables[match[2]]) return err('variable-rename: variable "' + match[2] + '" already exists');
                    variables[match[2]] = variables[match[1]];
                    delete variables[match[1]];
                    return '';
                }

                /* --------- variable-replace --------- */
                if (command === 'variable-replace') {
                    const match = rest.match(/^\[\s*"([^"]+)"\s*\]\s*([\s\S]+)$/);
                    if (!match) return err('variable-replace: Usage: variable-replace["name"]"newValue"');
                    const nameErr = varNameError(match[1]);
                    if (nameErr) return err('variable-replace: ' + nameErr);
                    if (!variables[match[1]]) return err('variable-replace: variable "' + match[1] + '" not found');
                    const parsed = parseValueWithNewlines(match[2].trim());
                    if (!parsed.ok) return err('variable-replace: ' + parsed.error);
                    const originalType = variables[match[1]].type;
                    if (originalType === 'text') {
                        variables[match[1]].value = parsed.value;
                        delete variables[match[1]].segments;
                    } else if (originalType === 'number') {
                        if (parsed.value.includes('\n')) {
                            variables[match[1]].value = parsed.value;
                            delete variables[match[1]].segments;
                        } else {
                            if (!isValidNumber(parsed.value)) return err('variable-replace: not a valid number');
                            variables[match[1]].value = parseFloat(parsed.value);
                            delete variables[match[1]].segments;
                        }
                    }
                    return '';
                }

                /* --------- length --------- */
                if (command === 'length') {
                    const listLenMatch = rest.match(/^\[\s*list\s*\]\s*-\s*\[\s*"([^"]+)"\s*\]\s*(?:"([^"]*)")?\s*$/i);
                    if (listLenMatch) {
                        const listName = listLenMatch[1], itemName = listLenMatch[2];
                        if (!lists[listName]) return err('length: list "' + listName + '" not found');
                        if (itemName === undefined) return String(Object.keys(lists[listName]).length);
                        if (!lists[listName].hasOwnProperty(itemName)) return err('length: item "' + itemName + '" not found');
                        return String(lists[listName][itemName].length);
                    }
                    const funcLenMatch = rest.match(/^\[\s*functional\s*\]\s*-\s*\[\s*"([^"]+)"\s*\]\s*(?:-\s*(\d+))?\s*$/i);
                    if (funcLenMatch) {
                        const funcName = funcLenMatch[1], idxStr = funcLenMatch[2];
                        if (!functions[funcName]) return err('length: function "' + funcName + '" not found');
                        const cmds = functions[funcName];
                        if (idxStr === undefined) return String(cmds.length);
                        const idx = parseInt(idxStr, 10);
                        if (idx < 1 || idx > cmds.length) return err('length: index out of range');
                        return String(cmds[idx - 1].length);
                    }
                    if (rest.startsWith('"')) {
                        const m = rest.match(/^"([^"]*)"\s*$/);
                        if (!m) return err('length: unterminated string');
                        return String(m[1].length);
                    }
                    if (rest.startsWith('[')) {
                        const m = rest.match(/^\[\s*"([^"]+)"\s*\]\s*$/);
                        if (!m) return err('length: invalid variable ref');
                        const nameErr = varNameError(m[1]);
                        if (nameErr) return err('length: ' + nameErr);
                        if (!variables[m[1]]) return err('length: variable not found');
                        if (variables[m[1]].type !== 'text') return err('length: only works on text');
                        return String(variables[m[1]].value.length);
                    }
                    return err('length: bad syntax');
                }

                /* --------- input-choose (all modes) --------- */
                if (command === 'input-choose') {
                    // ----- LONG-PRESS -----
                    const lpMatch = rest.match(/^\[\s*long-press\s*\]([\s\S]*)$/i);
                    if (lpMatch) {
                        let remaining = lpMatch[1].trim();

                        // Old storage mode: -["varName"]-type"prompt"-time["N"]"key"="value"
                        if (/^-\s*\[\s*"/.test(remaining)) {
                            const vnMatch = remaining.match(/^-\s*\[\s*"([^"]+)"\s*\]\s*/);
                            const varName = vnMatch[1];
                            remaining = remaining.substring(vnMatch[0].length).trim();

                            const nameErr = varNameError(varName);
                            if (nameErr) return err('input-choose[long-press]: ' + nameErr);
                            if (variables[varName]) return err('input-choose[long-press]: variable "' + varName + '" already exists');

                            let varColor = null;
                            const colorFirstMatch = remaining.match(/^-color\s*\[\s*"([^"]+)"\s*\]\s*/i);
                            if (colorFirstMatch) {
                                varColor = colorFirstMatch[1];
                                const ce = colorError(varColor);
                                if (ce) return err('input-choose[long-press]: ' + ce);
                                remaining = remaining.substring(colorFirstMatch[0].length).trim();
                            }

                            const typeMatch = remaining.match(/^-?\s*(text|number)\s*/i);
                            if (!typeMatch) return err('input-choose[long-press]: missing type (text or number)');
                            const type = typeMatch[1].toLowerCase();
                            remaining = remaining.substring(typeMatch[0].length);

                            const timeStartMatch = remaining.match(/^([\s\S]*?)(-\s*time\s*\[[\s\S]*)$/i);
                            if (!timeStartMatch) {
                                return err('input-choose[long-press]: expected at least one -time["N"]"key"="value" entry');
                            }
                            const promptExpr = timeStartMatch[1].trim();
                            remaining = timeStartMatch[2];

                            let promptSegments = [];
                            if (promptExpr !== '') {
                                const pr = parseMultiColorValue(promptExpr, varColor, true);
                                if (!pr.ok) return err('input-choose[long-press]: ' + pr.error);
                                promptSegments = pr.value;
                            }
